apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  # Specify a name
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
        exec:
          # if the binary is in your PATH, you can do
          path: ksops
          # otherwise, path should be relative to manifest files, like
          # path: ../../../ksops
files:
  - secrets/prowlarr-apikey.enc.yaml
  - secrets/sabnzbd-passwords.enc.yaml
  - secrets/windscribe-wireguard-creds.enc.yaml
  - secrets/windscribe-openvpn-creds.enc.yaml
  - secrets/sonarr-config-restic.enc.yaml
  - secrets/radarr-config-restic.enc.yaml
  - secrets/prowlarr-config-restic.enc.yaml
  - secrets/bazarr-config-restic.enc.yaml
  - secrets/jellyseerr-config-restic.enc.yaml
  - secrets/sabnzbd-state-restic.enc.yaml
