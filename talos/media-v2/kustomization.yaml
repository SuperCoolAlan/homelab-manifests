apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media-v2

resources:
- shared-pvcs.yaml
- local-storage.yaml
- resources/jellyseerr-public-ingress.yaml
- resources/jellyseerr-config-pvc.yaml
- resources/local-asandov-ingresses.yaml
- configs/setup-rbac.yaml
- windscribe-openvpn-configmap.yaml

generators:
- secrets-generator.yaml

# VPN sidecar for SABnzbd and password substitution
patches:
- target:
    kind: Deployment
    name: sabnzbd
  path: patches/add-gluetun-to-sabnzbd.yaml
- target:
    kind: Deployment
    name: sabnzbd
  path: patches/sabnzbd-envsubst-init.yaml
- target:
    kind: Deployment
    name: sonarr
  path: patches/sonarr-install-unrar.yaml
# seerr chart ships a helm-test Pod; don't let ArgoCD sync it
- target:
    kind: Pod
    name: jellyseerr-test-connection
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Pod
    metadata:
      name: jellyseerr-test-connection


helmCharts:
- name: sonarr
  repo: https://media-servarr.shw.al/charts
  version: 0.14.1
  releaseName: sonarr
  namespace: media-v2
  valuesFile: values-overrides/sonarr-values.yaml
    
- name: radarr
  repo: https://media-servarr.shw.al/charts
  version: 1.8.0
  releaseName: radarr
  namespace: media-v2
  valuesFile: values-overrides/radarr-values.yaml

- name: prowlarr
  repo: https://media-servarr.shw.al/charts
  version: 0.26.0
  releaseName: prowlarr
  namespace: media-v2
  valuesFile: values-overrides/prowlarr-values.yaml

- name: sabnzbd
  repo: https://media-servarr.shw.al/charts
  version: 1.2.1
  releaseName: sabnzbd
  namespace: media-v2
  valuesFile: values-overrides/sabnzbd-values.yaml

- name: bazarr
  repo: https://media-servarr.shw.al/charts
  version: 0.15.1
  releaseName: bazarr
  namespace: media-v2
  valuesFile: values-overrides/bazarr-values.yaml

- name: seerr-chart
  repo: oci://ghcr.io/seerr-team/seerr
  version: 3.9.1
  releaseName: jellyseerr
  namespace: media-v2
  valuesFile: values-overrides/jellyseerr-values.yaml
