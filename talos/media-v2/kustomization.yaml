apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media-v2

resources:
- shared-pvcs.yaml
- local-storage.yaml
- resources/external-truenas-svc.yaml
- resources/jellyfin-ingress.yaml
- resources/jellyseerr-public-ingress.yaml
- resources/local-asandov-ingresses.yaml
- configs/setup-rbac.yaml
- windscribe-openvpn-configmap.yaml

generators:
- secrets-generator.yaml

# VPN sidecar for SABnzbd and password substitution
patches:
- target:
    kind: Deployment
    name: sabnzbd
  path: patches/add-gluetun-to-sabnzbd.yaml
- target:
    kind: Deployment
    name: sabnzbd
  path: patches/sabnzbd-envsubst-init.yaml
- target:
    kind: Deployment
    name: sonarr
  path: patches/sonarr-install-unrar.yaml
# TEMPORARY: held at 0 while /config is copied to the -fast claims on local
# ZFS. sqlite must not be copied live, and these two are the busiest writers of
# the set. Removed in the follow-up commit that repoints volumes.config.
# The namespace below is load-bearing: without it kustomize resolves the patch
# to Deployment/<name>.[noNs], matches nothing, and hard-fails the whole render.
- target:
    kind: Deployment
    name: sonarr
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sonarr
      namespace: media-v2
    spec:
      replicas: 0
- target:
    kind: Deployment
    name: radarr
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: radarr
      namespace: media-v2
    spec:
      replicas: 0

helmCharts:
- name: sonarr
  repo: https://media-servarr.shw.al/charts
  version: 0.14.1
  releaseName: sonarr
  namespace: media-v2
  valuesFile: values-overrides/sonarr-values.yaml
    
- name: radarr
  repo: https://media-servarr.shw.al/charts
  version: 1.8.0
  releaseName: radarr
  namespace: media-v2
  valuesFile: values-overrides/radarr-values.yaml

- name: prowlarr
  repo: https://media-servarr.shw.al/charts
  version: 0.26.0
  releaseName: prowlarr
  namespace: media-v2
  valuesFile: values-overrides/prowlarr-values.yaml

- name: sabnzbd
  repo: https://media-servarr.shw.al/charts
  version: 1.2.1
  releaseName: sabnzbd
  namespace: media-v2
  valuesFile: values-overrides/sabnzbd-values.yaml

- name: bazarr
  repo: https://media-servarr.shw.al/charts
  version: 0.15.1
  releaseName: bazarr
  namespace: media-v2
  valuesFile: values-overrides/bazarr-values.yaml

- name: jellyseerr
  repo: https://media-servarr.shw.al/charts
  version: 0.5.0
  releaseName: jellyseerr
  namespace: media-v2
  valuesFile: values-overrides/jellyseerr-values.yaml
