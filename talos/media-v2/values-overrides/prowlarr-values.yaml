# Disabled - exportarr needs secret "prowlarr" with key "apiKey"
metrics:
  enabled: false

# Chart 0.26.0 requires either value or ref on each secret; an empty value
# renders an empty secretKeyRef.name in the prepare-config init container.
# ref points at the SOPS-managed secret (secrets/prowlarr-apikey.enc.yaml).
secrets:
  - name: 'apiKey'
    ref: 'prowlarr-apikey'

# Inherited from original media deployment
persistentVolumeClaims:
  prowlarr-config: null  # chart default — superseded by prowlarr-config-ssd
  # On ssd-array (4x480G raidz2). Migrated off the `fast` pool 2026-08-12:
  # fast has had no redundancy since 2026-08-10 (both mirrors down to one
  # leg - see ~/Documents/truenas-migration/FAST-POOL-RECOVERY.md) and
  # nothing on it is backed up. Low-write config volume, so raidz2's
  # small-write penalty does not apply the way it does to jellyfin/unifi.
  prowlarr-config-ssd:
    requestStorage: '5Gi'
    storageClassName: 'ssd-array'

# Configure URL base to serve from root
application:
  urlBase: ""
  config:
    contents: |
      <Config>
        <LogLevel>info</LogLevel>
        <EnableSsl>False</EnableSsl>
        <Port>9696</Port>
        <UrlBase></UrlBase>
        <BindAddress>*</BindAddress>
        <ApiKey>$apiKey</ApiKey>
        <AnalyticsEnabled>False</AnalyticsEnabled>
        <AuthenticationMethod>External</AuthenticationMethod>
        <UpdateMechanism>Docker</UpdateMechanism>
        <Branch>master</Branch>
        <InstanceName>Prowlarr</InstanceName>
      </Config>

# Use specific UID/GID that matches TrueNAS NFS user
deployment:
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  serviceAccountName: media-apps
  volumes:
    config:
      persistentVolumeClaim:
        # Migrated off TrueNAS NFS 2026-08-09; the NFS claim was dropped
        # 2026-08-10 when TrueNAS was decommissioned.
        claimName: 'prowlarr-config-ssd'
    downloads:
      persistentVolumeClaim:
        claimName: 'media-downloads'
    media-library:
      persistentVolumeClaim:
        claimName: 'media-library'
  container:
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "3001"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'downloads'
        mountPath: '/downloads'
      - name: 'media-library'
        mountPath: '/media/film'
        subPath: 'film'
      - name: 'media-library'
        mountPath: '/media/tv'
        subPath: 'tv'

ingress:
  enabled: true
  className: traefik
  host: prowlarr.asandov.local
  path: /
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd