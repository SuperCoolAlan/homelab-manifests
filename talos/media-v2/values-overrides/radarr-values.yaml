# Disabled - exportarr needs secret "radarr" with key "apiKey"
metrics:
  enabled: false

# Inherited from original media deployment
persistentVolumeClaims:
  radarr-config: null  # chart default — superseded by radarr-config-fast
  # On the local ZFS `fast` pool. The original TrueNAS NFS claim
  # (radarr-config) was dropped 2026-08-10 with the TrueNAS decommission. Its
  # PV is Retain so the dataset survives, but the server exporting it does not,
  # so the claim could never bind again.
  radarr-config-fast:
    requestStorage: '10Gi'
    storageClassName: 'fast-array'
  # Staged replacement on ssd-array while `fast` runs with no redundancy
  # (both mirrors down to one leg since 2026-08-10). Low-write config
  # volume, so raidz2's small-write penalty is irrelevant here.
  radarr-config-ssd:
    requestStorage: '10Gi'
    storageClassName: 'ssd-array'

# Disable config.xml mounting - let app manage its own config
application:
  config: null

ingress:
  enabled: true
  className: traefik
  host: radarr.asandov.local
  path: /
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd

# Configure deployment with volumes and API key sync sidecar
deployment:
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  serviceAccountName: media-apps
  # Configure volumes to use shared PVCs
  volumes:
    config:
      persistentVolumeClaim:
        # Migrated off TrueNAS NFS 2026-08-09; the NFS claim was dropped
        # 2026-08-10 when TrueNAS was decommissioned.
        claimName: 'radarr-config-fast'
    sabnzbd-downloads:
      persistentVolumeClaim:
        claimName: 'sabnzbd-downloads'
    media-library:
      persistentVolumeClaim:
        claimName: 'media-library'
  # Configure volume mounts with subPath
  container:
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'sabnzbd-downloads'
        mountPath: '/downloads-usenet'
      # Single full mount so imports from /media/torrents into /media/film
      # can hardlink (same filesystem AND same mount). Root folder path
      # /media/film is unchanged.
      - name: 'media-library'
        mountPath: '/media'