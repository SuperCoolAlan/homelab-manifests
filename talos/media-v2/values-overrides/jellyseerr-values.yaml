# Jellyseerr configuration for media requests
persistentVolumeClaims:
  # Original TrueNAS NFS claim. Kept while the migration soaks so rollback is
  # just pointing deployment.volumes.config back at it - the underlying PV is
  # Retain and still holds the data. Reap once verified.
  jellyseerr-config:
    requestStorage: '5Gi'
    storageClassName: 'nfs'
  # Replacement on the local ZFS `fast` pool. storageClassName is immutable on
  # a PVC, hence a second claim rather than editing the first.
  jellyseerr-config-fast:
    requestStorage: '5Gi'
    storageClassName: 'fast-array'

# Use specific UID/GID that matches TrueNAS NFS user
deployment:
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  volumes:
    config:
      persistentVolumeClaim:
        # Migrated off TrueNAS NFS 2026-08-09. Rollback is one line: point this
        # back at jellyseerr-config - its PV is Retain and still holds the data.
        claimName: jellyseerr-config-fast
  container:
    image:
      repository: 'fallenbagel/jellyseerr'
      tag: 'preview-OIDC'
      pullPolicy: Always
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "3001"
      - name: TZ
        value: "America/New_York"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Disable initial config to let it create its own
application:
  config: null

ingress:
  enabled: true
  className: traefik
  host: jellyseerr.asandov.local
  path: /
  pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyseerr.asandov.local