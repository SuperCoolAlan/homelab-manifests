# Seerr (ex-Jellyseerr) — official seerr-team chart
# Auth is Jellyfin login (LDAP via Authentik outpost), not OIDC.

# Extra ingress manifests (public cloudflare + local.asandov.com) reference
# service "jellyseerr" on port 5055 — keep both stable.
fullnameOverride: jellyseerr
service:
  port: 5055

config:
  persistence:
    # On ssd-array (4x480G raidz2); low-write config volume, migrated off the
    # unredundant `fast` pool 2026-08-12.
    existingClaim: jellyseerr-config-ssd

extraEnv:
  - name: TZ
    value: 'America/New_York'

resources:
  requests:
    memory: '256Mi'
    cpu: '100m'
  limits:
    memory: '1Gi'
    cpu: '1000m'

nodeSelector:
  kubernetes.io/hostname: talos-ramhaus

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyseerr.asandov.local
  hosts:
    - host: jellyseerr.asandov.local
      paths:
        - path: /
          pathType: Prefix
