# Jellyseerr configuration for media requests
persistentVolumeClaims:
  jellyseerr-config: null  # chart default — superseded by jellyseerr-config-fast
  # On the local ZFS `fast` pool. The original TrueNAS NFS claim
  # (jellyseerr-config) was dropped 2026-08-10 with the TrueNAS decommission -
  # its PV is Retain so the dataset survives, but the server exporting it is
  # gone.
  jellyseerr-config-fast:
    requestStorage: '5Gi'
    storageClassName: 'fast-array'
  # Staged replacement on ssd-array while `fast` runs with no redundancy
  # (both mirrors down to one leg since 2026-08-10). Low-write config
  # volume, so raidz2's small-write penalty is irrelevant here.
  jellyseerr-config-ssd:
    requestStorage: '5Gi'
    storageClassName: 'ssd-array'

# Use specific UID/GID that matches TrueNAS NFS user
deployment:
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  volumes:
    config:
      persistentVolumeClaim:
        # Migrated off TrueNAS NFS 2026-08-09; the NFS claim was dropped
        # 2026-08-10 when TrueNAS was decommissioned.
        claimName: jellyseerr-config-ssd
  container:
    image:
      repository: 'fallenbagel/jellyseerr'
      tag: 'preview-OIDC'
      pullPolicy: Always
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "3001"
      - name: TZ
        value: "America/New_York"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Disable initial config to let it create its own
application:
  config: null

ingress:
  enabled: true
  className: traefik
  host: jellyseerr.asandov.local
  path: /
  pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyseerr.asandov.local