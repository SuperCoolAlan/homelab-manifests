# Jellyseerr configuration for media requests
persistentVolumeClaims:
  jellyseerr-config: null  # chart default — superseded by jellyseerr-config-ssd
  # On ssd-array (4x480G raidz2). Migrated off the `fast` pool 2026-08-12:
  # fast has had no redundancy since 2026-08-10 (both mirrors down to one
  # leg - see ~/Documents/truenas-migration/FAST-POOL-RECOVERY.md) and
  # nothing on it is backed up. Low-write config volume, so raidz2's
  # small-write penalty does not apply the way it does to jellyfin/unifi.
  jellyseerr-config-ssd:
    requestStorage: '5Gi'
    storageClassName: 'ssd-array'

# Use specific UID/GID that matches TrueNAS NFS user
deployment:
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  volumes:
    config:
      persistentVolumeClaim:
        # Migrated off TrueNAS NFS 2026-08-09; the NFS claim was dropped
        # 2026-08-10 when TrueNAS was decommissioned.
        claimName: jellyseerr-config-ssd
  container:
    image:
      repository: 'fallenbagel/jellyseerr'
      tag: 'preview-OIDC'
      pullPolicy: Always
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "3001"
      - name: TZ
        value: "America/New_York"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Disable initial config to let it create its own
application:
  config: null

ingress:
  enabled: true
  className: traefik
  host: jellyseerr.asandov.local
  path: /
  pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: jellyseerr.asandov.local