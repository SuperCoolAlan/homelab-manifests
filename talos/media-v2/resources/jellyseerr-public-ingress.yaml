# Public host, reached via cloudflared -> traefik `tunnel` entrypoint
# (see cluster-services/traefik/resources/public-tunnel-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyseerr-public
  namespace: media-v2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: tunnel
spec:
  ingressClassName: traefik
  rules:
  - host: jellyseerr.asandov.com
    http:
      paths:
      - backend:
          service:
            name: jellyseerr
            port:
              number: 5055
        path: /
        pathType: Prefix
