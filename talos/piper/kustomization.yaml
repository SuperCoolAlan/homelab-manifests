apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: piper

resources:
  - namespace.yaml
  - pvc-fast.yaml

# TEMPORARY: held at 0 while /data is copied to wyoming-piper-data-fast on
# local ZFS. Removed in the follow-up commit that switches persistence to
# existingClaim.
patches:
  - target:
      kind: Deployment
      name: wyoming-piper
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: wyoming-piper
        namespace: piper
      spec:
        replicas: 0

helmCharts:
  - name: wyoming-piper
    repo: https://gitlab.com/api/v4/projects/62293226/packages/helm/stable
    version: 0.1.4
    releaseName: wyoming-piper
    namespace: piper
    valuesFile: values.yaml
