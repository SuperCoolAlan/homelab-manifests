image:
  # renovate: datasource=docker depName=rhasspy/wyoming-piper
  tag: "2.4.3"
  args: ["--voice", "en_US-lessac-medium"]

service:
  type: LoadBalancer

nodeSelector:
  kubernetes.io/hostname: talos-ramhaus

persistence:
  data:
    enabled: true
    size: 5Gi
    # Migrated off TrueNAS NFS 2026-08-09. Rollback is one line: point this back
    # at wyoming-piper-data (declared in pvc-legacy.yaml) - its PV is Retain and
    # still holds the original voice models.
    existingClaim: wyoming-piper-data-fast

livenessProbe:
  httpGet: null
  tcpSocket:
    port: http
  initialDelaySeconds: 30

readinessProbe:
  httpGet: null
  tcpSocket:
    port: http

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
