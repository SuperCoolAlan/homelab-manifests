# Dynamic fast-array volume (mirrored SSD, zfs-localpv on ramhaus). Must stay local:
# the entrypoint chowns /data/postgres, which a root-squashed NFS export refuses.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-data
  namespace: tracearr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 10Gi
