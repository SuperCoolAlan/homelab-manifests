apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  namespace: tracearr
  labels:
    app: tracearr
spec:
  # PHASE4-QUIESCE: scaled to 0 for the TrueNAS disk swap. tracearr-data is an
  # NFS PVC on truenas.asandov.local; a pod holding it when TrueNAS goes away
  # wedges on a stale handle.
  #
  # This one is already in CrashLoopBackOff (chown /data/postgres: Operation not
  # permitted), so nothing is lost by parking it. Restore to 1 alongside
  # pv-local.yaml.staged. Grep PHASE4-QUIESCE for the full set.
  replicas: 0
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      securityContext:
        fsGroup: 102
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:supervised
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: tracearr-secrets
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /data/postgres
              subPath: postgres
            - name: data
              mountPath: /data/tracearr
              subPath: tracearr
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracearr-data
