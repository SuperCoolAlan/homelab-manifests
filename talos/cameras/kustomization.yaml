apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cameras

resources:
  - namespace.yaml
  - discovery-job.yaml
  - frigate/frigate.yaml
  - frigate/monitoring.yaml

generators:
  - secrets-generator.yaml

# Hash-suffixed, so editing a file changes the pod spec that mounts it and
# Frigate restarts and re-seeds its config. (The discovery PostSync hook re-runs
# on every sync of this app regardless.)
configMapGenerator:
  - name: camera-discovery
    files:
      - discover.sh
  - name: frigate-seed
    files:
      - frigate/config.yml
