apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate-local-asandov
  namespace: frigate
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: frigate.local.asandov.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  number: 80
  tls:
    - hosts:
        - frigate.local.asandov.com
      secretName: frigate-local-tls
