# crowdsec-web-ui -> Service -> socat -> wg0 -> Oracle LAPI at 10.100.0.1:8080.
# One pod per VPS: every jumphost uses 10.100.0.1 on wg0, so one netns can't route to more than one.
# Peer IPs (.5 jelly, .6 monero, .11 snowflake) are hardcoded in each VPS's wg0.conf and its 8080 INPUT accept.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jelly
  labels:
    app.kubernetes.io/name: crowdsec-lapi-tunnel
    app.kubernetes.io/instance: jelly
spec:
  # Exactly one: two pods presenting the same key would flap the VPS's single peer endpoint.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-lapi-tunnel
      app.kubernetes.io/instance: jelly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-lapi-tunnel
        app.kubernetes.io/instance: jelly
    spec:
      initContainers:
        - name: wg-up
          image: linuxserver/wireguard:1.0.20260223
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 077
              cat > /tmp/wg.conf <<EOF
              [Interface]
              PrivateKey = $(cat /secrets/jelly)

              [Peer]
              PublicKey = wmYukGZetdwvr7odYv0BoonsCdz3UmXSqsz9hrrvfXI=
              AllowedIPs = 10.100.0.1/32
              Endpoint = 163.192.195.190:51820
              PersistentKeepalive = 25
              EOF
              # Not wg-quick: it rewrites resolv.conf and routes, breaking cluster DNS in the pod.
              ip link add wg0 type wireguard
              wg setconf wg0 /tmp/wg.conf
              ip address add 10.100.0.5/32 dev wg0
              ip link set wg0 mtu 1370 up
              ip route add 10.100.0.1/32 dev wg0
              rm -f /tmp/wg.conf
              wg show wg0
          volumeMounts:
            - name: wg-keys
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: forwarder
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:8080,fork,reuseaddr
            - TCP:10.100.0.1:8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          ports:
            - name: lapi
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: wg-keys
          secret:
            secretName: lapi-tunnel-wg-keys
            defaultMode: 0400
---
