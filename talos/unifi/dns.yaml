# Stable name for UniFi device inform + discovery.
#
# ⚠️ NOT a .local name. The first attempt used unifi.asandov.local and the U6+
# reported `Unable to resolve` — .local is reserved for mDNS/Bonjour, and the
# AP's resolver routes it to multicast rather than unicast DNS. OPNsense answers
# the record correctly (dig @10.0.1.1 returns it), so the record was fine; the
# device simply will not ask for it that way. macOS tolerates this, the AP does
# not.
#
# local.asandov.com is a real unicast zone, already in external-dns's
# domainFilters, and resolves normally on the AP's network - the same zone the
# browser UI uses.
#
# Points at the pinned MetalLB IP from service.yaml. Deployed alongside the
# workload rather than ahead of it: the "point devices at a name first, flip DNS
# later" trick did not survive contact, because Override Inform Host only
# overrides the HOST - the port comes from the controller. TrueNAS serves inform
# on NodePort 30073 while this Deployment serves 8080, so the AP needs one
# explicit `set-inform` at cutover regardless. The name still earns its place
# for any device added later.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: unifi-dns
  namespace: unifi
spec:
  endpoints:
    - dnsName: unifi-inform.local.asandov.com
      recordType: A
      targets:
        - 10.0.7.202
