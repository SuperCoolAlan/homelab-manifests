apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snowflake
  namespace: snowflake
  labels:
    app.kubernetes.io/name: snowflake
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: snowflake
  endpoints:
    - port: metrics
      path: /internal/metrics
      interval: 60s
    # Alerts and dashboards select on these job names, not the shared Service name.
    - port: tor-metrics
      path: /metrics
      interval: 60s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: tor-bridge
    - port: conduit-metrics
      path: /metrics
      interval: 60s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: conduit
