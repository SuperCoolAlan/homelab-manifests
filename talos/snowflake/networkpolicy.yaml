# This forwarder is the only path to the Oracle proxy's metrics; admit just vmagent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: snowflake
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snowflake-metrics
  namespace: snowflake
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snowflake
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: metrics
          protocol: TCP
  # WireGuard UDP is the only egress; metrics ride inside it.
  egress:
    - to:
        - ipBlock:
            cidr: 170.9.244.226/32
      ports:
        - port: 51820
          protocol: UDP
