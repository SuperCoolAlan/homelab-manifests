# Snowflake, the Tor bridge and Conduit run on Oracle (docs/oracle-wireguard-jumphost.md#snowflake-proxy); this pod only carries their metrics.
# vmagent -> Service -> socat -> wg0 -> 10.100.0.1:{9999,9035,9090}. Peer IP .7 is hardcoded in the VPS's wg0.conf, its INPUT accepts and torrc's MetricsPortPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowflake
  namespace: snowflake
  labels:
    app.kubernetes.io/name: snowflake
spec:
  # Exactly one: two pods presenting the same key would flap the VPS's single peer endpoint.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: snowflake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snowflake
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: wg-up
          image: linuxserver/wireguard:1.0.20260223
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 077
              cat > /tmp/wg.conf <<EOF
              [Interface]
              PrivateKey = $(cat /secrets/private-key)

              [Peer]
              PublicKey = B31LFquE549qd8JW4zGS7b1XsVNIPI/mS29xFVhRDkA=
              AllowedIPs = 10.100.0.1/32
              Endpoint = 170.9.244.226:51820
              PersistentKeepalive = 25
              EOF
              # Not wg-quick: it rewrites resolv.conf and routes, breaking cluster networking in the pod.
              ip link add wg0 type wireguard
              wg setconf wg0 /tmp/wg.conf
              ip address add 10.100.0.7/32 dev wg0
              ip link set wg0 mtu 1370 up
              ip route add 10.100.0.1/32 dev wg0
              rm -f /tmp/wg.conf
              wg show wg0
          volumeMounts:
            - name: wg-key
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: forwarder
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:9999,fork,reuseaddr
            - TCP:10.100.0.1:9999
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          ports:
            - name: metrics
              containerPort: 9999
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        # tor's MetricsPortPolicy accepts only 10.100.0.7, so this must share the wg-up netns above.
        - name: tor-metrics
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:9035,fork,reuseaddr
            - TCP:10.100.0.1:9035
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          ports:
            - name: tor-metrics
              containerPort: 9035
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: conduit-metrics
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:9090,fork,reuseaddr
            - TCP:10.100.0.1:9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          ports:
            - name: conduit-metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: wg-key
          secret:
            secretName: snowflake-wg-key
            defaultMode: 0400
