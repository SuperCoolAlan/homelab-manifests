# Replacement for maintainerr-data (storageClassName: nfs, TrueNAS-backed).
# storageClassName is immutable on a PVC, so the migration to local ZFS goes
# via a second claim rather than editing the original. Once the deployment is
# cut over and verified, pvc.yaml and the maintainerr-data-nfs PV can be reaped.
#
# Data is copied by a one-shot Job while the deployment sits at replicas: 0 -
# maintainerr keeps its state in sqlite, which must not be copied live.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maintainerr-data-fast
  namespace: maintainerr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 1Gi
