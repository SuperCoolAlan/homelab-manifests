apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actualbudget

resources:
  - namespace.yaml
  - pvc-fast.yaml

# TEMPORARY: held at 0 while /data is copied to actualbudget-data-fast.
patches:
  - target:
      kind: Deployment
      name: actualbudget
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: actualbudget
        namespace: actualbudget
      spec:
        replicas: 0

generators:
  - secrets-generator.yaml

helmCharts:
  - name: actualbudget
    repo: https://community-charts.github.io/helm-charts
    version: 1.9.2
    releaseName: actualbudget
    namespace: actualbudget
    valuesFile: values.yaml
