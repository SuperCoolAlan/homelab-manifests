apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actualbudget

resources:
  - namespace.yaml

generators:
  - secrets-generator.yaml

helmCharts:
  - name: actualbudget
    repo: https://community-charts.github.io/helm-charts
    version: 1.8.7
    releaseName: actualbudget
    namespace: actualbudget
    valuesFile: values.yaml
