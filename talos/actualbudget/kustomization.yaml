apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actualbudget

resources:
  - namespace.yaml
  - pvc-fast.yaml
  - pvc-ssd.yaml


generators:
  - secrets-generator.yaml

patches:
  - target:
      kind: Deployment
      name: actualbudget
    path: quiesce.yaml

helmCharts:
  - name: actualbudget
    repo: https://community-charts.github.io/helm-charts
    version: 1.9.2
    releaseName: actualbudget
    namespace: actualbudget
    valuesFile: values.yaml
