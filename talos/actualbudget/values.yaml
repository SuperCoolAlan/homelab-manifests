strategy:
  type: Recreate
  rollingUpdate: null

image:
  tag: "26.5.2"

persistence:
  enabled: true
  storageClass: truenas-nfs
  accessModes:
    - ReadWriteOnce
  size: 5Gi

login:
  method: openid
  openid:
    enforce: false
    providerName: Authentik
    discoveryUrl: https://auth.local.asandov.com/application/o/actualbudget/.well-known/openid-configuration
    authMethod: openid
    existingSecret:
      name: actualbudget-oidc
      clientIdKey: client-id
      clientSecretKey: client-secret

extraEnvVars:
  debug: "*"

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: budget.local.asandov.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: budget-local-tls
      hosts:
        - budget.local.asandov.com
