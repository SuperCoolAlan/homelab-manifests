# The original chart-created `actualbudget-data` PVC, transcribed from the live
# object so Argo sees it as in-sync.
#
# Once persistence.existingClaim points at actualbudget-data-fast the chart
# stops rendering this PVC, and prune: true would delete it. Its PV was
# reclaimPolicy Delete when this migration started - which would have destroyed
# the dataset on TrueNAS outright - and was patched to Retain first. Even so,
# losing the PVC would leave the PV Released with a stale claimRef needing manual
# clearing before it could rebind, so it is declared here to keep rollback to a
# one-line existingClaim change.
#
# Delete this file once the migration has soaked.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actualbudget-data
  namespace: actualbudget
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs
  volumeName: pvc-8fec29fe-06d3-4a24-bda9-7a0570c907ec
  resources:
    requests:
      storage: 5Gi
