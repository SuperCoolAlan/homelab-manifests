# Replacement for the chart-created `actualbudget-data` PVC.
#
# Unlike the static `nfs` PVs migrated earlier, actualbudget-data was a DYNAMIC
# truenas-nfs claim whose PV had reclaimPolicy: Delete - deleting the PVC would
# have told democratic-csi to destroy the dataset on TrueNAS. The PV was patched
# to Retain on 2026-08-09 before any of this was touched, so the source now
# survives PVC removal.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actualbudget-data-fast
  namespace: actualbudget
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 5Gi
