# One-shot scrub of the TrueNAS media pool, run from the cluster so it survives
# a laptop going to sleep. Follow it with:
#   kubectl logs -n truenas-maintenance -f job/truenas-pool1-scrub
#
# The scrub itself runs on TrueNAS and completes whether or not this Job is
# watching; the Job exists to start it and to give a readable progress log.
apiVersion: batch/v1
kind: Job
metadata:
  name: truenas-pool1-scrub
spec:
  backoffLimit: 2
  # The 2026-07-26 scrub took ~2h27m, but the pool has grown and early ZFS
  # estimates on the 2026-08-09 run pointed at ~8h. 16h ceiling keeps plenty of
  # headroom without letting a wedged Job linger indefinitely.
  # NB: this deadline only kills the *monitor* - the scrub itself runs on
  # TrueNAS and continues regardless.
  activeDeadlineSeconds: 57600
  ttlSecondsAfterFinished: 604800 # keep logs around for a week
  template:
    metadata:
      labels:
        app.kubernetes.io/name: truenas-pool1-scrub
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scrub
          image: python:3.12-alpine
          command: ["python3", "/opt/scrub/scrub-monitor.py"]
          env:
            - name: TRUENAS_URL
              value: https://truenas.asandov.local/api/v2.0
            - name: POOL_NAME
              value: ST6000NM0095-pool1
            - name: POLL_INTERVAL
              value: "60"
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenas-api
                  key: api-key
          volumeMounts:
            - name: script
              mountPath: /opt/scrub
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: truenas-scrub-script
            defaultMode: 0555
