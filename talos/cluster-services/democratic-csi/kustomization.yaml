apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# democratic-csi's helm chart renders a VolumeSnapshotClass, which requires the
# snapshot.storage.k8s.io CRDs + snapshot-controller. These live in kube-system.
# TODO: verify v8.2.0 is the current stable release before merging.
# https://github.com/kubernetes-csi/external-snapshotter/releases
resources:
  - namespace.yaml
  - github.com/kubernetes-csi/external-snapshotter/client/config/crd?ref=v8.2.0
  - github.com/kubernetes-csi/external-snapshotter/deploy/kubernetes/snapshot-controller?ref=v8.2.0

helmGlobals:
  chartHome: helm
helmCharts:
  - name: democratic-csi
    valuesFile: values-nfs.yaml
    releaseName: nfs-csi
    namespace: nfs-csi
  # not working w/ Talos
  # - name: democratic-csi
  #   valuesFile: values-iscsi.yaml
  #   releaseName: iscsi-csi
  #   namespace: iscsi-csi

generators:
  - secrets-generator.yaml

