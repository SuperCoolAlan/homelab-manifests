apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# democratic-csi's helm chart renders a VolumeSnapshotClass, which requires the
# snapshot.storage.k8s.io CRDs + snapshot-controller. These live in kube-system.
# Vendored (not remote refs): git fetches to GitHub's origin crawl at ~1Mbps
# per flow on this network's Starlink transit, blowing kustomize's 27s remote
# timeout on every ArgoCD render. To bump: copy client/config/crd and
# deploy/kubernetes/snapshot-controller from the new tag into vendor/.
# https://github.com/kubernetes-csi/external-snapshotter/releases
resources:
  - namespace.yaml
  - vendor/external-snapshotter-v8.2.0/crd
  - vendor/external-snapshotter-v8.2.0/snapshot-controller

helmGlobals:
  chartHome: helm
helmCharts:
  - name: democratic-csi
    valuesFile: values-nfs.yaml
    releaseName: nfs-csi
    namespace: nfs-csi
  # not working w/ Talos
  # - name: democratic-csi
  #   valuesFile: values-iscsi.yaml
  #   releaseName: iscsi-csi
  #   namespace: iscsi-csi

generators:
  - secrets-generator.yaml

