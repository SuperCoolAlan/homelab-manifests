apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: volsync-system

resources:
  - namespace.yaml

helmCharts:
  - name: volsync
    repo: https://backube.github.io/helm-charts/
    version: 0.16.0
    releaseName: volsync
    namespace: volsync-system
    valuesFile: values.yaml
    # Chart only renders its ServiceMonitor when this exact kind is advertised; the patch below targets it.
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor

patches:
  # controller-runtime's secure metrics endpoint 401s anonymous scrapes; vmagent's SA already has get on /metrics.
  - target:
      kind: ServiceMonitor
      name: volsync
    patch: |-
      - op: add
        path: /spec/endpoints/0/bearerTokenFile
        value: /var/run/secrets/kubernetes.io/serviceaccount/token
