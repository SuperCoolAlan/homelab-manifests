apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nvidia-device-plugin

resources:
  - namespace.yaml
  - runtimeclass.yaml

helmCharts:
  - name: nvidia-device-plugin
    repo: https://nvidia.github.io/k8s-device-plugin
    version: 0.19.3
    releaseName: nvidia-device-plugin
    namespace: nvidia-device-plugin
    valuesFile: values.yaml
