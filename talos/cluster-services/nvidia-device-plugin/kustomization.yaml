apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nvidia-device-plugin

resources:
  - namespace.yaml
  - runtimeclass.yaml

# This was disabled 2026-08-09 because every plugin pod died with:
#
#   nvidia-container-cli: mount error: failed to add device rules: unable to
#   create new device filters program: load program: invalid argument:
#   last insn is not an exit or jmp   ... Auto-detected mode as 'legacy'
#
# That was read at the time as a cgroups-v2 problem requiring CDI mode. It was
# not. Talos defaults net.core.bpf_jit_harden=2, which constant-blinds *every*
# JIT-compiled BPF program - privileged ones included - and the device-filter
# program the toolkit builds does not survive that rewrite. The Talos NVIDIA
# guide prescribes net.core.bpf_jit_harden=1 (blind unprivileged programs only)
# on GPU nodes for exactly this reason.
#
# Re-enabled 2026-08-10 by that one sysctl on talos-ramhaus; see
# talos/config/worker-ramhaus-nvme.yaml. No CDI specs, no config.toml override
# and no reboot were needed - legacy mode is fine once the program can load.
helmCharts:
  - name: nvidia-device-plugin
    repo: https://nvidia.github.io/k8s-device-plugin
    version: 0.19.3
    releaseName: nvidia-device-plugin
    namespace: nvidia-device-plugin
    valuesFile: values.yaml
