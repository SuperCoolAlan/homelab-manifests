# The Talos nvidia-container-toolkit extension registers an `nvidia` runtime in
# containerd, but nothing uses it until a RuntimeClass points at that handler.
#
# Without this (and the device plugin alongside it) the GTX 1660 Ti is invisible
# to the scheduler: the driver is loaded on the node (NVRM 570.172.08, modules
# live) yet `nvidia.com/gpu` is absent from node capacity entirely, so any pod
# requesting one stays Pending forever.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
