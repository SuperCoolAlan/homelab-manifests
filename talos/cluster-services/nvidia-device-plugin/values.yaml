# Pods must run under the nvidia runtime to see the device.
runtimeClassName: nvidia

# Only ramhaus has the GPU. blackbox is the control-plane and has none, so
# without this the DaemonSet would crashloop there.
nodeSelector:
  kubernetes.io/hostname: talos-ramhaus

# The chart's default nodeAffinity requires one of three Node Feature Discovery
# labels (feature.node.kubernetes.io/pci-10de.present,
# feature.node.kubernetes.io/cpu-model.vendor_id=NVIDIA, or
# nvidia.com/gpu.present). NFD is not installed here, so none of them exist and
# the DaemonSet sat at DESIRED 0 - scheduled nowhere, silently, while Argo
# reported Synced/Healthy.
#
# Cleared rather than installing NFD: there is exactly one GPU on one known
# node, and nodeSelector above already targets it precisely. Revisit if a second
# GPU node ever appears.
#
# Must be `null`, not `{}` - Helm deep-merges maps, so an empty map leaves the
# chart's nested nodeAffinity intact. null is what actually removes the key.
affinity: null

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Two time-sliced slots on the one GPU so Jellyfin and the Looped speech-to-text
# worker both stay scheduled. Time-slicing has no memory isolation: the 6 GB is
# shared, so a second CUDA tenant must stay small enough to fit beside Jellyfin.
config:
  default: default
  map:
    default: |-
      version: v1
      sharing:
        timeSlicing:
          # a pod asking for 2 would hold both slots and lock out the other app
          failRequestsGreaterThanOne: true
          resources:
            - name: nvidia.com/gpu
              replicas: 2
