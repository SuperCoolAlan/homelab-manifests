# external-snapshotter: the snapshot.storage.k8s.io CRDs and snapshot-controller.
#
# ⚠️ THIS IS NOT OPTIONAL INFRASTRUCTURE. The CRDs and controller are cluster-wide
# and underpin VolSync: immich-photos uses copyMethod: Snapshot, because
# zfs-localpv refuses a second mount of a volume its application already holds
# open - so any future ReplicationSource needs these too.
#
# Vendored rather than referenced remotely, because git fetches
# to GitHub's origin crawl at ~1Mbps over this network's Starlink transit,
# blowing kustomize's 27s remote timeout on every ArgoCD render. To bump: copy
# client/config/crd and deploy/kubernetes/snapshot-controller from the new tag
# into vendor/.
# https://github.com/kubernetes-csi/external-snapshotter/releases
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vendor/external-snapshotter-v8.2.0/crd
  - vendor/external-snapshotter-v8.2.0/snapshot-controller

# Delete=false,Prune=false on every object here.
#
# These CRDs are data-bearing: deleting one cascade-deletes its custom
# resources, so an accidental prune takes every VolumeSnapshot and
# VolumeSnapshotContent in the cluster with it, and zfs-localpv-snapshot's
# deletionPolicy: Delete then removes the underlying ZFS snapshots.
#
# The ApplicationSet's resources-finalizer would otherwise cascade-delete these
# CRDs if this app's directory were ever removed.
#
# Keeping it means this app cannot prune them either. That is the intent: CRDs
# holding live custom resources should never disappear because a manifest moved.
# Removing a CRD is then a deliberate manual act.
commonAnnotations:
  argocd.argoproj.io/sync-options: Delete=false,Prune=false
