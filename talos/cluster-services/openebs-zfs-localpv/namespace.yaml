apiVersion: v1
kind: Namespace
metadata:
  name: openebs-zfs
  labels:
    # zfs-localpv node/controller pods need privileged (hostPath /dev + kubelet
    # dir, host mounts) to manage datasets on the ramhaus `ssd` pool
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
