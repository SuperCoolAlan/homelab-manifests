# OpenEBS ZFS-LocalPV values overrides
# Chart defaults: helm/zfs-localpv/values.yaml — only override what differs

analytics:
  # No phone-home
  enabled: false

crds:
  csi:
    volumeSnapshots:
      # VolumeSnapshot CRDs already owned by the democratic-csi app
      # (cluster-services/democratic-csi vendors external-snapshotter);
      # rendering them twice makes two Argo apps fight over the same CRDs
      enabled: false
