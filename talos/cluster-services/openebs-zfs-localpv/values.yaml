# OpenEBS ZFS-LocalPV values overrides
# Chart defaults: helm/zfs-localpv/values.yaml — only override what differs

zfsNode:
  # Default /home/keys can't exist on Talos (read-only root); only /var is
  # writable. Dir is only used for ZFS encryption keys (none yet)
  encrKeysDir: /var/openebs/keys

analytics:
  # No phone-home
  enabled: false

crds:
  csi:
    volumeSnapshots:
      # VolumeSnapshot CRDs are owned by cluster-services/external-snapshotter;
      # rendering them twice makes two Argo apps fight over the same CRDs
      enabled: false
