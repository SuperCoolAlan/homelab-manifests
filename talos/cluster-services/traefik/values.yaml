service:
  type: LoadBalancer

# CrowdSec bouncer plugin: enforces LAPI decisions on the tunnel entrypoint.
# abortOnPluginFailure stays at the chart default (false) so a plugin fetch
# failure degrades to "no bouncing" instead of taking traefik down.
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

# Bouncer API key, mounted as a file (the plugin reads *File variants) so the
# key stays in SOPS instead of being inlined in the Middleware CRD.
deployment:
  additionalVolumes:
    - name: crowdsec-bouncer-key
      secret:
        secretName: crowdsec-bouncer-key

additionalVolumeMounts:
  - name: crowdsec-bouncer-key
    mountPath: /secrets/crowdsec
    readOnly: true

# Enable metrics and ServiceMonitor
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

# Enable Kubernetes Ingress provider (needed for forward-auth middleware)
providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
  kubernetesCRD:
    enabled: true
    allowExternalNameServices: true
    # The app Ingresses live in their own namespaces but reference the single
    # crowdsec-bouncer Middleware in the traefik namespace.
    allowCrossNamespace: true

# Ports configuration
ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: "600s"
  ldap:
    port: 3890
    exposedPort: 389
    expose:
      default: true
    protocol: TCP
  # Cloudflare Tunnel traffic enters here (cloudflared -> traefik -> app).
  # Separate from `web` because that entrypoint 308s everything to https,
  # which would loop behind the tunnel (TLS already terminated at the edge).
  tunnel:
    port: 8081
    exposedPort: 8081
    # Without this the entrypoint exists in the pod but never lands on the
    # Service, and cloudflared gets connection-refused -> 502.
    expose:
      default: true
    protocol: TCP
    forwardedHeaders:
      # Trust X-Forwarded-* from cloudflared pods so apps and access logs
      # see the real client IP, not the pod IP. CrowdSec detection is blind
      # without this - the private-range whitelist eats pod-IP events.
      trustedIPs:
        - 10.244.0.0/16

# CLF access logs -> stdout -> VictoriaLogs -> CrowdSec (type: traefik).
# Deliberately NOT json: the VL collector flattens JSON lines into fields,
# and traefik's access JSON has no "msg" key, so records arrive with no
# _msg at all and crowdsec (which reads _msg) parses nothing. CLF keeps the
# whole line in _msg. User-Agent must be kept: headers default to drop and
# http-bad-user-agent needs it.
accessLog:
  enabled: true
  format: common
  fields:
    headers:
      names:
        User-Agent: keep

# Enable dashboard for debugging (internal only)
ingressRoute:
  dashboard:
    enabled: false
