apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: traefik
  repo: https://traefik.github.io/charts
  version: 41.2.0
  releaseName: traefik
  namespace: traefik
  valuesFile: values.yaml
  includeCRDs: true
  # Chart's servicemonitor.yaml hard-fails unless this capability is
  # advertised; ArgoCD supplies it via --helm-api-versions, plain
  # kustomize (CI, local builds) needs it declared here.
  apiVersions:
    - monitoring.coreos.com/v1
