apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  infra:
    nodePlacement:
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
  configuration:
    developerConfiguration:
      useEmulation: false
      featureGates:
        # Required to pin a VM to a specific architecture when the cluster
        # has mixed architectures (talos-blackbox arm64, talos-ramhaus amd64).
        - MultiArchitecture
        # Grows a VM's disk.img to fill its PVC after a resize; without it Filesystem-mode disks keep their old size.
        - ExpandDisks
