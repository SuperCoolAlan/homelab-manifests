# VictoriaLogs Collector values
# Collects logs from all Kubernetes pods

# Send logs to VictoriaLogs. Base URL only — vlagent appends /insert/native
# itself; adding a path (e.g. /insert/jsonline) makes the server reject every
# block as unparseable. Service name must match the victoria-logs-single release.
remoteWrite:
  - url: http://victoria-logs-victoria-logs-single-server.monitoring.svc:9428

# The collector flattens JSON log lines into fields and looks for the message
# among these keys. Authentik's JSON calls it `event`, so without that entry
# its records land with no _msg at all and CrowdSec parses none of them
# (3.9k hits / 0 parsed until 2026-08-31). The first three are the chart
# defaults, restated because this list replaces rather than merges.
msgField:
  - message
  - msg
  - log
  - event

# Run on all nodes
tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    # 256Mi OOMKilled the ramhaus pod: vlagent buffers blocks for every
    # workload on the node and needs headroom when replaying backlog
    memory: 1Gi
