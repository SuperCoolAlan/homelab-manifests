# The router's own GUI name, matching its Let's Encrypt cert (os-acme-client, Cloudflare DNS-01).
# Must be declared here: external-dns runs policy=sync over local.asandov.com and prunes undeclared overrides.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: opnsense-dns
  namespace: external-dns
spec:
  endpoints:
    - dnsName: opnsense.local.asandov.com
      recordType: A
      targets:
        - 10.0.1.1
