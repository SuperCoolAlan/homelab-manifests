# VictoriaMetrics K8s Stack values
# Replaces kube-prometheus-stack with more efficient storage and queries

# Grafana with SSO via Authentik
grafana:
  enabled: true
  replicas: 1  # Single replica for session affinity with OAuth
  revisionHistoryLimit: 5
  headlessService: true
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  plugins:
    - ae3e-plotly-panel
  grafana.ini:
    server:
      root_url: https://grafana.local.asandov.com
      protocol: http
      enforce_domain: false
    session:
      provider: file
    security:
      cookie_secure: true
      cookie_samesite: lax
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      client_id: $__env{AUTHENTIK_CLIENT_ID}
      client_secret: $__env{AUTHENTIK_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.local.asandov.com/application/o/authorize/
      token_url: https://auth.local.asandov.com/application/o/token/
      api_url: https://auth.local.asandov.com/application/o/userinfo/
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
  envFromSecrets:
    - name: grafana-authentik-oauth
      optional: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      external-dns.alpha.kubernetes.io/target: 10.0.7.200
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.local.asandov.com
    path: /
    tls:
      - secretName: grafana-local-tls
        hosts:
          - grafana.local.asandov.com
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"

# VMSingle for homelab (simpler than VMCluster)
vmsingle:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      external-dns.alpha.kubernetes.io/target: 10.0.7.200
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - vm.local.asandov.com
    path: /
    pathType: Prefix
    tls:
      - secretName: vmsingle-local-tls
        hosts:
          - vm.local.asandov.com
  spec:
    retentionPeriod: "90d"
    replicaCount: 1
    extraArgs:
      dedup.minScrapeInterval: 30s
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: vm-local
      resources:
        requests:
          storage: 50Gi
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 8Gi

# VMAgent collects metrics and sends to VMSingle
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    extraArgs:
      # kube-apiserver /metrics is ~17.6MB uncompressed and exceeds the 16MiB
      # default, so the whole target was being dropped. See kubeApiServer below,
      # which also trims the unused histogram families.
      promscrape.maxScrapeSize: "32MB"
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 2Gi
    # additionalScrapeConfigs held four static jobs against TrueNAS
    # (truenas-gpu :9835, truenas-graphite :9108, truenas-dcgm :9400,
    # truenas-pdu :8088). It was commented out well before the migration, so
    # none of them were scraping; the whole block went with the decommission
    # on 2026-08-10 along with resources/additional-scrape-configs.yaml.
    #
    # Two capabilities are genuinely gone rather than moved:
    #   - GPU telemetry (:9835 nvidia-gpu-exporter, :9400 dcgm). The card is in
    #     ramhaus now; re-home these once NVIDIA-GPU-HANDOFF.md is resolved.
    #   - PDU power draw (:8088). Not a storage exporter and not replaced -
    #     needs a new host if that data is wanted.

# VMAlert for alerting rules
vmalert:
  enabled: true
  spec:
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus

# Configure datasource name and UID for dashboard compatibility
defaultDatasources:
  victoriametrics:
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        isDefault: true
        url: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8428

# Alertmanager
alertmanager:
  enabled: true
  spec:
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus

# Operator settings - convert Prometheus ServiceMonitors
victoria-metrics-operator:
  enabled: true
  crds:
    plain: false
    enabled: true
  operator:
    disable_prometheus_converter: false
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus

# Node exporter for host metrics
prometheus-node-exporter:
  enabled: true

# Kube-state-metrics for k8s object metrics
kube-state-metrics:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus

# Kube-apiserver metrics.
#
# The endpoint list is restated in full because Helm replaces lists rather than
# merging them - everything except metricRelabelConfigs matches the chart default.
#
# The dropped histogram families account for ~2.8MB of the ~17.6MB response and
# are referenced by no dashboard and no VMRule. apiserver_request_duration_seconds
# and apiserver_request_sli_duration_seconds are deliberately kept: the latter
# backs the kube-apiserver availability/burnrate/histogram SLO rule groups.
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket

# Kubelet metrics
kubelet:
  enabled: true
  vmScrape:
    spec:
      # ⚠️ Overriding relabelConfigs REPLACES the chart's list - Helm merges maps
      # but not sequences. The first three entries below are the chart defaults
      # restated verbatim; only the labeldrop at the end is ours. If the chart is
      # upgraded, re-diff this against
      # charts/victoria-metrics-k8s-stack-*/victoria-metrics-k8s-stack/values.yaml.
      #
      # Why the labeldrop exists (fixed 2026-08-10):
      #
      # The chart's `labelmap __meta_kubernetes_node_label_(.+)` copies *every*
      # node label onto *every* kubelet and cadvisor series. That is harmless on
      # talos-blackbox, which has 7 node labels. talos-ramhaus has 417, because
      # KubeVirt's node-labeller stamps one label per CPU feature, CPU model and
      # migration-compatible model:
      #
      #   147  cpu-feature.node.kubevirt.io/*
      #   113  cpu-model-migration.node.kubevirt.io/*
      #    93  host-model-required-features.node.kubevirt.io/*
      #    18  cpu-model.node.kubevirt.io/*
      #    15  machine-type.node.kubevirt.io/*
      #    12  hyperv.node.kubevirt.io/*
      #
      # That made every ramhaus series carry 421 labels, and VictoriaMetrics
      # defaults -maxLabelsPerTimeseries=30. Rows over the limit are *ignored
      # outright*, not truncated - so every kubelet and cadvisor sample from the
      # node that runs the entire workload was silently discarded at ingestion.
      # vmsingle had counted 8,109,257 of them under
      # vm_rows_ignored_total{reason="too_many_labels"}.
      #
      # Nothing surfaced it: the scrape targets all reported up with no error,
      # because the drop happens at the storage end, after a successful scrape.
      # The visible symptom was that every Kubernetes compute-resources dashboard
      # was blank for talos-ramhaus while looking fine for the control plane.
      #
      # Dropping the three families below leaves 8 node labels and ~18 total per
      # series, well inside the limit. The KubeVirt labels describe the host's
      # CPU capabilities and mean nothing on a per-container metric; the
      # extensions_talos_dev_* ones grow every time a system extension is added,
      # which is exactly how this would creep back; beta_kubernetes_io_* are
      # deprecated duplicates of kubernetes_io_*.
      relabelConfigs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet
        - action: labeldrop
          regex: (.*_node_kubevirt_io_.*|extensions_talos_dev_.*|beta_kubernetes_io_.*)

# Disable kubeControllerManager - name too long and Talos doesn't expose it standard way
kubeControllerManager:
  enabled: false

# Disable kubeScheduler - same reason
kubeScheduler:
  enabled: false

# Default dashboards from the chart. node-exporter-full is large enough to blow
# the client-side-apply annotation limit; the ArgoCD ApplicationSet sets
# ServerSideApply=true, so it applies cleanly.
defaultDashboards:
  enabled: true
  dashboards:
    node-exporter-full:
      enabled: true
