# VictoriaMetrics K8s Stack values
# Replaces kube-prometheus-stack with more efficient storage and queries

# Grafana with SSO via Authentik
grafana:
  enabled: true
  replicas: 1  # Single replica for session affinity with OAuth
  revisionHistoryLimit: 5
  headlessService: true
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus
  plugins:
    - ae3e-plotly-panel
  grafana.ini:
    server:
      root_url: https://grafana.local.asandov.com
      protocol: http
      enforce_domain: false
    session:
      provider: file
    security:
      cookie_secure: true
      cookie_samesite: lax
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      client_id: $__env{AUTHENTIK_CLIENT_ID}
      client_secret: $__env{AUTHENTIK_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.local.asandov.com/application/o/authorize/
      token_url: https://auth.local.asandov.com/application/o/token/
      api_url: https://auth.local.asandov.com/application/o/userinfo/
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
  envFromSecrets:
    - name: grafana-authentik-oauth
      optional: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      external-dns.alpha.kubernetes.io/target: 10.0.7.200
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.local.asandov.com
    path: /
    tls:
      - secretName: grafana-local-tls
        hosts:
          - grafana.local.asandov.com
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"

# VMSingle for homelab (simpler than VMCluster)
vmsingle:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      external-dns.alpha.kubernetes.io/target: 10.0.7.200
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - vm.local.asandov.com
    path: /
    pathType: Prefix
    tls:
      - secretName: vmsingle-local-tls
        hosts:
          - vm.local.asandov.com
  spec:
    retentionPeriod: "90d"
    replicaCount: 1
    extraArgs:
      dedup.minScrapeInterval: 30s
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: vm-local
      resources:
        requests:
          storage: 50Gi
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 8Gi

# VMAgent collects metrics and sends to VMSingle
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    extraArgs:
      # kube-apiserver /metrics is ~17.6MB uncompressed and exceeds the 16MiB
      # default, so the whole target was being dropped. See kubeApiServer below,
      # which also trims the unused histogram families.
      promscrape.maxScrapeSize: "32MB"
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 2Gi
    # additionalScrapeConfigs temporarily disabled
    # additionalScrapeConfigs:
    #   name: vm-additional-scrape-configs
    #   key: prometheus-additional.yaml

# VMAlert for alerting rules
vmalert:
  enabled: true
  spec:
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus

# Configure datasource name and UID for dashboard compatibility
defaultDatasources:
  victoriametrics:
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        isDefault: true
        url: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:8428

# Alertmanager
alertmanager:
  enabled: true
  spec:
    nodeSelector:
      kubernetes.io/hostname: talos-ramhaus

# Operator settings - convert Prometheus ServiceMonitors
victoria-metrics-operator:
  enabled: true
  crds:
    plain: false
    enabled: true
  operator:
    disable_prometheus_converter: false
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus

# Node exporter for host metrics
prometheus-node-exporter:
  enabled: true

# Kube-state-metrics for k8s object metrics
kube-state-metrics:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: talos-ramhaus

# Kube-apiserver metrics.
#
# The endpoint list is restated in full because Helm replaces lists rather than
# merging them - everything except metricRelabelConfigs matches the chart default.
#
# The dropped histogram families account for ~2.8MB of the ~17.6MB response and
# are referenced by no dashboard and no VMRule. apiserver_request_duration_seconds
# and apiserver_request_sli_duration_seconds are deliberately kept: the latter
# backs the kube-apiserver availability/burnrate/histogram SLO rule groups.
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          metricRelabelConfigs:
            - action: drop
              source_labels: [__name__]
              regex: apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket

# Kubelet metrics
kubelet:
  enabled: true

# Disable kubeControllerManager - name too long and Talos doesn't expose it standard way
kubeControllerManager:
  enabled: false

# Disable kubeScheduler - same reason
kubeScheduler:
  enabled: false

# Default dashboards from the chart. node-exporter-full is large enough to blow
# the client-side-apply annotation limit; the ArgoCD ApplicationSet sets
# ServerSideApply=true, so it applies cleanly.
defaultDashboards:
  enabled: true
  dashboards:
    node-exporter-full:
      enabled: true
