# Library database, metadata, settings and the custom index.html web mod.
# fast-array (mirrored SSD) rather than ssd-array: jellyfin's config is sqlite
# and does a lot of small synchronous writes, which the raidz2 pool is worst at.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 20Gi
---
# Image/metadata cache. Fully regenerable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 20Gi
