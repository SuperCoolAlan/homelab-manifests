apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the config PVC is RWO and the GPU is a single
  # exclusive device, so a second pod could never schedule alongside the first.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Both the GPU and the media pool are on ramhaus. The media PV's
      # nodeAffinity would force this anyway; stating it is clearer.
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      # Selects containerd's `nvidia` runtime, which is what injects the driver
      # libraries and /dev/nvidia* into the container. The nvidia.com/gpu limit
      # below allocates the device; without this line it is allocated but unusable.
      #
      # Disabled 2026-08-09 to 2026-08-10 while nvidia.com/gpu was not allocatable.
      # The cause was net.core.bpf_jit_harden on the node, not anything here - see
      # talos/config/worker-ramhaus-nvme.yaml.
      runtimeClassName: nvidia
      securityContext:
        # Matches the uid/gid the media tree already uses across the *arr stack,
        # so jellyfin can read what sonarr/radarr write without a chown pass.
        runAsUser: 1000
        runAsGroup: 3001
        fsGroup: 3001
      # Stamp the git-managed transcoding + network settings into the config
      # PVC before jellyfin reads them. See talos/jellyfin/config/*.xml.
      #
      # A copy, not a mount: jellyfin rewrites encoding.xml in place whenever
      # anything is saved from the dashboard, and it needs the whole
      # /config/config directory writable to do that. A subPath mount would be
      # read-only to jellyfin and would also never pick up ConfigMap updates.
      #
      # Reuses the jellyfin image rather than pulling busybox - it is already
      # on the node, so this adds no pull and no second image to track.
      initContainers:
        - name: seed-encoding-config
          image: jellyfin/jellyfin:10.11.5
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /config/config
              cp /seed/encoding.xml /config/config/encoding.xml
              cp /seed/network.xml /config/config/network.xml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: encoding-config
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: jellyfin
          # Pinned to what TrueNAS was running, so the config database is opened
          # by the same version that wrote it. Upgrade deliberately, afterwards.
          image: jellyfin/jellyfin:10.11.5
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: TZ
              value: America/Chicago
            # Advertise NVENC/NVDEC to the container. Harmless without the
            # nvidia runtime; re-activates automatically when the GPU is
            # re-enabled above.
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /mnt/media
            # TrueNAS backed both of these with a /mnt/transcode-ram RAM disk;
            # a Memory-medium emptyDir is the direct equivalent and keeps
            # transcode churn off the SSDs entirely.
            - name: transcodes
              mountPath: /config/transcodes
            - name: transcodes
              mountPath: /cache/transcodes
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Exactly one GPU — the 1660 Ti cannot be split, so if ollama or
              # wyoming-whisper ever move onto this node they contend for it
              # rather than share it. Requesting it here means jellyfin holds it.
              nvidia.com/gpu: 1
              # Must exceed the transcodes tmpfs sizeLimit plus jellyfin's own
              # working set: tmpfs pages count against this cgroup, and a VOD
              # remux writes the whole file into it ahead of playback.
              memory: 24Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        # Consumed only by the seed-encoding-config initContainer. Kustomize
        # rewrites this name to the hashed one, so it tracks the file content.
        - name: encoding-config
          configMap:
            name: jellyfin-encoding
        - name: transcodes
          emptyDir:
            medium: Memory
            # ramhaus has 128 GiB; 16 GiB of tmpfs is generous for concurrent
            # transcodes and still leaves the node plenty of headroom.
            sizeLimit: 16Gi
