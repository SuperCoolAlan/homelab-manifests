# Media library for jellyfin.
#
# ⚠️ THIS IS THE PRE-PHASE-4 FORM. It points at the TrueNAS NFS export, the same
# one media-v2 and qbittorrent use today, so jellyfin can run NOW rather than
# waiting for the disk swap.
#
# AT PHASE 4, when ST6000NM0095-pool1 is imported onto ramhaus as `media` at
# /var/mnt/media, replace the PV below with the local: form — alongside
# talos/media-v2/shared-pvcs-local.yaml.staged and
# talos/qbittorrent/pvcs-local.yaml.staged, which do the same for their
# namespaces:
#
#   spec:
#     storageClassName: media-local
#     local:
#       path: /var/mnt/media
#     nodeAffinity:
#       required:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: kubernetes.io/hostname
#                 operator: In
#                 values: [talos-ramhaus]
#
# A PV's source and a PVC's volumeName are both immutable, so that swap means
# deleting and recreating both objects. Reclaim policy is Retain, so no data is
# touched.
#
# A PV binds to exactly one PVC, which is why the media library needs one PV per
# consuming namespace — media-v2, qbittorrent, and now jellyfin.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-library
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: truenas.asandov.local
    path: /mnt/ST6000NM0095-pool1/media
  mountOptions:
    - noatime
    - nfsvers=4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: jellyfin-media-library
  resources:
    requests:
      storage: 5Ti
