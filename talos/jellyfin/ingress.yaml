apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-local-asandov
  namespace: jellyfin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.local.asandov.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
  tls:
    - hosts:
        - jellyfin.local.asandov.com
      secretName: jellyfin-local-tls
# NO CLOUDFLARE TUNNEL INGRESS HERE — deliberate.
#
# jellyfin.asandov.com does NOT go through the tunnel. It resolves to an A
# record at 163.192.195.190, an Oracle Cloud instance that reverse-proxies to
# jellyfin. That is intentional: Cloudflare's terms discourage serving video
# through the proxy, so jellyfin bypasses it while jellyseerr, immich, authentik
# and gatus all use the tunnel normally.
#
# A jellyfin-cloudflare Ingress was added on 2026-08-09 with the in-cluster
# migration, on the mistaken assumption that jellyfin.asandov.com worked like
# the others. It was removed 2026-08-10 because it could never work and was
# actively harmful:
#
#   - The tunnel controller tries to publish a CNAME for the hostname, and
#     Cloudflare rejects it because the intentional A record already exists
#     (error 81053: "An A, AAAA, or CNAME record with that host already
#     exists"). The Ingress therefore never got a tunnel address.
#
#   - Worse, the controller applies its whole configuration in a single "put
#     exposures" call per reconcile, so this one failure aborted the batch every
#     cycle. authentik, gatus, immich and jellyseerr all logged the same error
#     and no tunnel configuration change could land for any of them. They kept
#     working only because their records already existed.
#
# If public jellyfin is broken, the fault is on the Oracle instance - most
# likely its upstream still points at the old TrueNAS jellyfin rather than the
# in-cluster Service. That host is not managed from this repo.
