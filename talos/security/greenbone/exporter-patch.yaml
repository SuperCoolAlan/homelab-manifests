# Sidecar, because gvmd's GMP socket is an emptyDir only this pod can reach.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvas
  namespace: greenbone
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scanner
    spec:
      containers:
        - name: exporter
          image: ghcr.io/greenbone/gvm-tools:26.1.2
          imagePullPolicy: IfNotPresent
          command: ["python3", "/exporter/exporter.py"]
          env:
            - name: GMP_USERNAME
              value: admin
            - name: GMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenbone-admin
                  key: PASSWORD
          ports:
            - name: metrics
              containerPort: 9966
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 96Mi}
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: gvmd-socket
              mountPath: /run/gvmd
            - name: exporter
              mountPath: /exporter
              readOnly: true
      volumes:
        - name: exporter
          configMap:
            name: greenbone-exporter
