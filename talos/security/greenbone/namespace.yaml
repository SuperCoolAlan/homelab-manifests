apiVersion: v1
kind: Namespace
metadata:
  name: greenbone
  labels:
    # ospd-openvas needs NET_ADMIN/NET_RAW and an unconfined seccomp profile, which baseline rejects.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
