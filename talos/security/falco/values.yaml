# Falco values overrides for homelab
# Ref: https://github.com/falcosecurity/charts/blob/master/charts/falco/values.yaml

driver:
  # Use modern eBPF driver - required for Talos (no kernel headers available)
  kind: modern_ebpf

falco:
  json_output: true
  http_output:
    enabled: true
    url: "http://falcosidekick.falco.svc:2801/"

metrics:
  enabled: true

serviceMonitor:
  # Enable Prometheus ServiceMonitor
  create: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Only run on ramhaus (flyer has limited RAM)
nodeSelector:
  kubernetes.io/hostname: talos-ramhaus

customRules:
  # Loaded from /etc/falco/rules.d after the stock rules, so overrides here win.
  homelab-exceptions.yaml: |-
    # containerd runs Cilium's CNI plugin (installed onto the host by the agent) for every pod sandbox; container.id=runtime is containerd itself.
    - macro: known_drop_and_execute_activities
      condition: (container.id = runtime and proc.pname = containerd and proc.exepath startswith /opt/cni/bin/)
      override:
        condition: replace
    # nvidia-container-toolkit's runtime hook runs ldconfig from a memfd while starting every GPU container.
    - macro: known_memfd_execution_processes
      condition: or (container.id = runtime and proc.pname = "nvidia-containe" and proc.exepath = "memfd:/usr/local/glibc/sbin/ldconfig")
      override:
        condition: append
