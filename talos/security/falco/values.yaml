# Falco values overrides for homelab
# Ref: https://github.com/falcosecurity/charts/blob/master/charts/falco/values.yaml

driver:
  # Use modern eBPF driver - required for Talos (no kernel headers available)
  kind: modern_ebpf

falco:
  json_output: true
  http_output:
    enabled: true
    url: "http://falcosidekick.falco.svc:2801/"

metrics:
  enabled: true

serviceMonitor:
  # Enable Prometheus ServiceMonitor
  create: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Only run on ramhaus (flyer has limited RAM)
nodeSelector:
  kubernetes.io/hostname: talos-ramhaus

customRules:
  # Loaded from /etc/falco/rules.d after the stock rules, so overrides here win.
  homelab-exceptions.yaml: |-
    # Cilium's CNI plugin (installed onto the host by the agent) runs for every pod sandbox: from containerd itself (container.id=runtime),
    # or from the thick multus daemon, which delegates through its /hostroot chroot.
    - macro: known_drop_and_execute_activities
      condition: >-
        (container.id = runtime and proc.pname = containerd and proc.exepath startswith /opt/cni/bin/)
        or (container.image.repository = ghcr.io/k8snetworkplumbingwg/multus-cni and proc.pname = multus-daemon
            and proc.exepath startswith /hostroot/opt/cni/bin/)
      override:
        condition: replace
    # nvidia-container-toolkit's runtime hook runs ldconfig from a memfd while starting every GPU container.
    - macro: known_memfd_execution_processes
      condition: or (container.id = runtime and proc.pname = "nvidia-containe" and proc.exepath = "memfd:/usr/local/glibc/sbin/ldconfig")
      override:
        condition: append
    # CNPG replicas pull WAL from the archive through a shell; stock postgres_running_cnpg only covers wal-archive.
    - macro: user_shell_container_exclusions
      condition: (container.image.repository = ghcr.io/cloudnative-pg/postgresql and proc.pname = postgres
                  and proc.cmdline startswith "sh -c /controller/manager wal-restore")
      override:
        condition: replace
    # p2pool's busybox stats httpd hands each accepted socket to its handler on stdin/stdout.
    - macro: user_known_stand_streams_redirect_activities
      condition: (k8s.ns.name = p2pool and container.image.repository = docker.io/library/busybox and proc.name = httpd)
      override:
        condition: replace
    # Controllers whose job is talking to the API server.
    - macro: user_known_contact_k8s_api_server_activities
      condition: >-
        (container.image.repository in (docker.io/twinproduction/gatus, quay.io/argoproj/argocd,
                                         ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar, ghcr.io/goauthentik/server))
      override:
        condition: replace
