# LAN-only access to the restricted RPC for wallet clients (Feather, Monero
# GUI, cake, etc). Restricted RPC is read-only-ish by design, but it is still
# unauthenticated - this is reachable by anything on the LAN. No Authentik
# forwardAuth middleware: wallet clients cannot complete an OAuth flow.
#
# This host is internal-only (external-dns-opnsense resolves *.local.asandov.com
# to the Traefik LB at 10.0.7.200); nothing here is published to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monerod-local-asandov
  namespace: monerod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: monerod.local.asandov.com
      http:
        paths:
          - backend:
              service:
                name: monerod-rpc
                port:
                  number: 18089
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - monerod.local.asandov.com
      secretName: monerod-local-tls
