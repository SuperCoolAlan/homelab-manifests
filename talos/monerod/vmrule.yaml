# Routed to the Monero Discord channel by `alertgroup: monero`. The exporter scrape has gaps, so sync and peer rules
# use max_over_time; a bare instant query would flap on every missed scrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: monero-monerod
  namespace: monerod
spec:
  groups:
    - name: monerod.alerts
      rules:
        - alert: MonerodNotReady
          expr: max(kube_statefulset_status_replicas_ready{namespace="monerod",statefulset="monerod"}) < 1
          for: 15m
          labels:
            severity: critical
            alertgroup: monero
          annotations:
            summary: monerod-0 has not been ready for 15m
            description: Check the wg-up and tor init containers first; both have failed a pod start before.
        - alert: MonerodNotSynchronized
          expr: max_over_time(max(monero_info_synchronized{namespace="monerod"})[15m]) == 0
          for: 15m
          labels:
            severity: warning
            alertgroup: monero
          annotations:
            summary: monerod reports not synchronized
            description: p2pool builds block templates on monerod's tip, so an unsynced node means stale or rejected shares.
        - alert: MonerodMetricsMissing
          expr: absent_over_time(monero_info_height{namespace="monerod"}[30m])
          for: 5m
          labels:
            severity: warning
            alertgroup: monero
          annotations:
            summary: No monerod exporter samples for 30m
            description: The exporter sidecar or monerod's loopback RPC is failing; every other monerod alert is blind until this clears.
        - alert: MonerodFewOutboundPeers
          expr: max_over_time(sum(monero_p2p_connections{namespace="monerod",type="out",state="normal"})[15m]) < 4
          for: 30m
          labels:
            severity: warning
            alertgroup: monero
          annotations:
            summary: monerod has only {{ $value }} outbound peers
            description: All monerod egress exits the monero jumphost (wg peer 10.100.0.3) and fails closed, so this usually means the tunnel is down.
        - alert: MonerodNoInboundPeers
          expr: max_over_time(sum(monero_p2p_connections{namespace="monerod",type="in"})[1h]) == 0
          for: 2h
          labels:
            severity: info
            alertgroup: monero
          annotations:
            summary: monerod has had no inbound peers for 2h
            description: Check the jumphost DNAT for tcp/18080 (table monerod_gw) and the OCI NSG monero-jumphost.
