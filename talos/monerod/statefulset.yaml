# monerod - Monero node with a pruned blockchain. Public P2P on the Oracle VPS
# (147.224.205.227:18080) via a WireGuard tunnel; anonymous tx relay via Tor.
#
# No operator: monerod is a single stateful process, so a StatefulSet plus a
# volumeClaimTemplate is the whole deployment. cirocosta/monero-operator wraps
# the same StatefulSet and has been dormant for years.
#
# The image is built from source on every upstream Monero release by
# https://github.com/sethforprivacy/simple-monerod-docker. Renovate tracks the
# tag directly.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monerod
  namespace: monerod
spec:
  serviceName: monerod-headless
  # Exactly one: a second pod would present the same WireGuard key and Oracle would flap between them.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monerod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monerod
    spec:
      # The `ssd` ZFS pool only exists on talos-ramhaus, and the ssd-array
      # StorageClass carries no allowedTopologies - without this the scheduler
      # can land the pod on talos-blackbox and provisioning fails.
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Default "Always" re-chowns ~110GiB of LMDB on every mount.
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wg-up
          # Used only for `wg` and `ip`; the s6 entrypoint is bypassed.
          # renovate: datasource=docker depName=linuxserver/wireguard versioning=loose
          image: linuxserver/wireguard:1.0.20260223@sha256:dca67384e3e9a5bcc288461fa983e6fcb0e248e5a2d8e5b3e5d3f753bfac3e35
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 077
              GW=$(ip -4 route show default | awk '{print $3}')
              # Only the private key is secret; the rest is public and stays readable here.
              cat > /tmp/wg.conf <<EOF
              [Interface]
              PrivateKey = $(cat /secrets/privatekey)

              [Peer]
              PublicKey = rE+qZRl4LnX8iG4wUTUxj+jVRMhqLlvP8kpH8vrzMQM=
              AllowedIPs = 0.0.0.0/0
              Endpoint = 147.224.205.227:51820
              PersistentKeepalive = 25
              EOF
              ip link del wg0 2>/dev/null || true
              ip link add wg0 type wireguard
              wg setconf wg0 /tmp/wg.conf
              rm -f /tmp/wg.conf
              # 10.100.0.3 is hardcoded in Oracle's DNAT/masquerade/FORWARD rules and wg0.conf peer.
              ip address add 10.100.0.3/32 dev wg0
              # 1370 = flannel VXLAN eth0 (1450) - 80 WG overhead; higher fragments every full packet. Keep jumphost wg0 equal.
              ip link set wg0 mtu 1370 up
              # Cluster, LAN (kubelet probes) and the tunnel endpoint stay on eth0; without these the pod loses DNS/probes.
              ip route replace 10.0.0.0/8 via "$GW" dev eth0
              ip route replace 147.224.205.227/32 via "$GW" dev eth0
              # All other egress exits Oracle so peers learn a dialable address. Fails closed if the tunnel is down.
              ip route replace default dev wg0
              wg show wg0
          volumeMounts:
            - name: wg-key
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: tor
          # renovate: datasource=docker depName=osminogin/tor-simple versioning=loose
          image: osminogin/tor-simple:0.4.9.13@sha256:9cd994f3bb813ae4ebd148ef077f8a61fd4420899e7ed5bcaa24aabd2d119648
          # Native sidecar: starts before monerod and the startup probe gates it on the .onion existing.
          restartPolicy: Always
          # Tor refuses group-accessible key dirs; fsGroup can re-grant group perms on mount, so re-tighten every start.
          command: ["/bin/sh", "-c", "mkdir -p /home/monero/.bitmonero/tor/hs && chmod -R go-rwx /home/monero/.bitmonero/tor && exec tor -f /etc/tor/torrc"]
          startupProbe:
            exec:
              command: ["test", "-s", "/home/monero/.bitmonero/tor/hs/monerod/hostname"]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bitmonero
              mountPath: /home/monero/.bitmonero
            - name: torrc
              mountPath: /etc/tor/torrc
              subPath: torrc
              readOnly: true
      containers:
        - name: monerod
          # Monero tags are 4-component (v0.18.5.1), which docker versioning
          # does not parse - loose does.
          # renovate: datasource=docker depName=ghcr.io/sethforprivacy/simple-monerod versioning=loose
          image: ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1@sha256:0329465ffc599048efd57712d91d3b4b7d66380bd7205d5d0992cd9faf668e38
          # Bypass the image's /entrypoint.sh, which ends in `exec fixuid -q
          # monerod --non-interactive "$@"`. fixuid is setuid-root and needs
          # NoNewPrivileges disabled, so it aborts under
          # allowPrivilegeEscalation: false and the container never starts.
          #
          # Skipping it costs nothing here: fixuid's /etc/fixuid/config.yml
          # targets user/group `monero` = 1000:1000, which is exactly what the
          # pod securityContext already requests, so it would remap 1000->1000.
          # Volume ownership is handled by fsGroup instead. The entrypoint's
          # only other job is a numactl prefix, and numactl is not in the image.
          # --non-interactive is the one flag it added, so pass it explicitly.
          #
          # sh only to read the .onion at start; args below arrive as "$@". 18084 must match torrc.
          command:
            - /bin/sh
            - -c
            - exec monerod "$@" --anonymous-inbound="$(cat /home/monero/.bitmonero/tor/hs/monerod/hostname):18084,127.0.0.1:18084,64"
            - monerod
          args:
            - --non-interactive
            # HOME is not reliably set by the runtime, and monerod derives its
            # default data dir from it. Be explicit.
            - --data-dir=/home/monero/.bitmonero
            # Keep ~1/8 of ring signature data. Still fully validating and
            # usable by any wallet.
            - --prune-blockchain
            # Restricted RPC only. The unrestricted daemon RPC (18081) stays
            # unbound - it exposes admin methods with no auth.
            - --rpc-restricted-bind-ip=0.0.0.0
            - --rpc-restricted-bind-port=18089
            # Full RPC stays loopback-only; only the exporter sidecar uses it. Never 0.0.0.0.
            - --rpc-bind-ip=127.0.0.1
            - --rpc-bind-port=18081
            # Loopback counts as a public IP (default limit 3); the exporter's parallel collectors exceed it and get reset.
            - --rpc-max-connections-per-public-ip=10
            # RPC errors ban the caller's IP, and a banned 127.0.0.1 cuts the exporter off until restart. 18089 is LAN-only.
            - --disable-rpc-ban
            # Oracle DNATs 18080 straight through, so the advertised port is the real one. No UPnP.
            - --no-igd
            # p2pool README's recommended node settings: faster block/tx propagation means fewer stale p2pool shares.
            # Upload stays bounded by --limit-rate-up below, so more peers do not cost Jellyfin uplink.
            - --out-peers=32
            - --in-peers=64
            - --add-priority-node=p2pmd.xmrvsbeast.com:18080
            - --add-priority-node=nodes.hashvault.pro:18080
            - --enforce-dns-checkpointing
            # ~8 Mbit/s. Tunnel rides Starlink's ~10-17 Mbit/s uplink; higher starves Jellyfin, the priority service.
            - --limit-rate-up=1024
            # p2pool's block-template feed. Reachable only on the pod network (ClusterIP), never Oracle.
            - --zmq-pub=tcp://0.0.0.0:18083
            # Our own txs broadcast over Tor, never clearnet.
            - --tx-proxy=tor,127.0.0.1:9050,16
            # Ships in the image at this path.
            - --enable-dns-blocklist
            - --ban-list=/home/monero/ban_list.txt
          ports:
            - name: p2p
              containerPort: 18080
            - name: rpc
              containerPort: 18089
            - name: zmq
              containerPort: 18083
          # Opening a large LMDB after an unclean shutdown can take minutes, so
          # the startup probe is generous: up to 30m before the pod is failed.
          startupProbe:
            httpGet:
              path: /get_height
              port: rpc
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /get_height
              port: rpc
            periodSeconds: 30
            timeoutSeconds: 10
          # Deliberately tcpSocket, not the RPC endpoint: monerod can stop
          # answering HTTP promptly under heavy sync I/O, and an httpGet
          # liveness probe would restart it mid-flush.
          livenessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            # Every write (LMDB, log, p2pstate, rpc_ssl) lands in the data dir mount.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: bitmonero
              mountPath: /home/monero/.bitmonero
        - name: exporter
          # cirocosta/monero-exporter built by lalanza808/docker-monero-node. Needs the full RPC, hence localhost.
          # renovate: datasource=docker depName=lalanza808/exporter
          image: lalanza808/exporter:1.0.0@sha256:82b6946ee54abb97cf2633b94f6273feb64506953d99a286b237e4ddaba5476c
          args:
            - --monero-addr=http://127.0.0.1:18081
            - --bind-addr=:9000
          ports:
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: wg-key
          secret:
            secretName: monerod-wg-key
            defaultMode: 0400
        - name: torrc
          configMap:
            name: monerod-torrc
      # LMDB writes are memory-mapped and random; a slow drain here means an
      # unclean shutdown and a long recovery on the next start.
      terminationGracePeriodSeconds: 300
  volumeClaimTemplates:
    - metadata:
        name: bitmonero
      spec:
        accessModes: ["ReadWriteOnce"]
        # NOT fast-array (the cluster default) - that pool is degraded, and
        # NOT truenas-nfs: LMDB does memory-mapped random writes, which are
        # slow and corruption-prone over NFS.
        storageClassName: ssd-array
        resources:
          requests:
            # Pruned chain is ~110GiB today and grows ~15-20GiB/year. The ssd
            # pool has ~812GiB free; the class allows volume expansion.
            storage: 250Gi
