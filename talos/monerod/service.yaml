# Headless service backing the StatefulSet's stable network identity.
# Not used for client traffic - see monerod-rpc below.
apiVersion: v1
kind: Service
metadata:
  name: monerod-headless
  namespace: monerod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: monerod
  ports:
    - name: p2p
      port: 18080
      targetPort: p2p
    - name: rpc
      port: 18089
      targetPort: rpc
---
# Restricted RPC for in-cluster and (via the Traefik ingress) LAN wallet
# clients. The unrestricted RPC on 18081 is never bound - see statefulset.yaml.
apiVersion: v1
kind: Service
metadata:
  name: monerod-rpc
  namespace: monerod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monerod
  ports:
    - name: rpc
      port: 18089
      targetPort: rpc
    # p2pool uses the same host for RPC and ZMQ; keep both on this Service.
    - name: zmq
      port: 18083
      targetPort: zmq
---
# Scrape target for servicemonitor.yaml; the label is what it selects on.
apiVersion: v1
kind: Service
metadata:
  name: monerod-metrics
  namespace: monerod
  labels:
    app.kubernetes.io/name: monerod
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: monerod
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
