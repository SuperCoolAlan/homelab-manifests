# Privileged only for the wg-up init container's NET_ADMIN. monerod and tor
# still drop all capabilities; keep new containers unprivileged.
apiVersion: v1
kind: Namespace
metadata:
  name: monerod
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
