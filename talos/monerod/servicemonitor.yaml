# One endpoint per json-exporter module. The `module` label keeps the four `up` series distinct.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monerod
  namespace: monerod
  labels:
    app.kubernetes.io/name: monerod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: monerod
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /probe
      interval: 30s
      params:
        module: [info]
        target: ["http://127.0.0.1:18081/get_info"]
      relabelings:
        - action: replace
          targetLabel: module
          replacement: info
    - port: metrics
      path: /probe
      interval: 30s
      params:
        module: [net]
        target: ["http://127.0.0.1:18081/get_net_stats"]
      relabelings:
        - action: replace
          targetLabel: module
          replacement: net
    - port: metrics
      path: /probe
      interval: 60s
      params:
        module: [txpool]
        target: ["http://127.0.0.1:18081/get_transaction_pool_stats"]
      relabelings:
        - action: replace
          targetLabel: module
          replacement: txpool
    - port: metrics
      path: /probe
      interval: 60s
      params:
        module: [lastblock]
        target: ["http://127.0.0.1:18081/json_rpc"]
      relabelings:
        - action: replace
          targetLabel: module
          replacement: lastblock
