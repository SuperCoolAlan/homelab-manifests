apiVersion: apps/v1
kind: Deployment
metadata:
  name: looped-transcribe
spec:
  replicas: 1
  # Recreate: Jellyfin holds the other GPU slot, so a surge pod could never schedule
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: looped-transcribe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: looped-transcribe
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      runtimeClassName: nvidia
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Built from images/looped-transcribe; CI only publishes :latest, Renovate bumps the digest.
          # renovate: datasource=docker depName=ghcr.io/supercoolalan/looped-transcribe
          image: ghcr.io/supercoolalan/looped-transcribe:latest
          env:
            - name: S3_ENDPOINT
              value: http://garage.garage.svc.cluster.local:3900
            - name: VLOGS_URL
              value: http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
            - name: HF_HOME
              value: /models
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          envFrom:
            - secretRef:
                name: looped-transcribe-s3
          ports:
            - name: metrics
              containerPort: 9100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # one of the two time-sliced slots; the 6 GB of VRAM is shared with Jellyfin
              nvidia.com/gpu: 1
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
