apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: looped-transcribe
spec:
  groups:
    - name: looped-transcribe.alerts
      rules:
        - alert: LoopedTranscribeDown
          expr: absent_over_time(up{job="looped-transcribe"}[15m]) or up{job="looped-transcribe"} == 0
          for: 10m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped transcription worker is down
            description: Audio piles up in Garage's incoming/ until it's back. Check the looped-transcribe pod and whether it got a GPU slot.
        - alert: LoopedTranscribeBacklog
          expr: looped_transcribe_oldest_pending_age_seconds > 1800
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped audio is waiting over 30 minutes to be transcribed
            description: The worker is falling behind or stuck. Check its logs and GPU memory next to Jellyfin.
        - alert: LoopedTranscribeFailed
          expr: looped_transcribe_failed_objects > 0
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "{{ $value }} Looped audio segments gave up on transcription"
            description: They are parked in Garage's looped-audio/failed/. Check the worker logs for the key, fix, then copy them back to incoming/.
