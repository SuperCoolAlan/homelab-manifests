apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: twingate

buildMetadata: [originAnnotations]

generators:
  - secrets-generator.yaml

# Two connectors, one per node, so remote access survives either node dying; each needs its own token pair.
helmCharts:
  - name: connector
    repo: https://twingate.github.io/helm-charts
    version: 0.1.35
    releaseName: twingate-op
    namespace: twingate
    valuesInline:
      connector:
        network: asandov
        existingSecret: "twingate-op-connector"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - talos-ramhaus
  - name: connector
    repo: https://twingate.github.io/helm-charts
    version: 0.1.35
    releaseName: twingate-rpi
    namespace: twingate
    valuesInline:
      connector:
        network: asandov
        existingSecret: "twingate-rpi-connector"
      nodeSelector:
        kubernetes.io/hostname: talos-blackbox
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
