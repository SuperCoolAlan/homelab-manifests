apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-postgres-store
  namespace: immich
spec:
  configuration:
    destinationPath: s3://asandov-cnpg/
    endpointURL: https://s3.us-west-004.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: cnpg-b2-asandov-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-b2-asandov-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
