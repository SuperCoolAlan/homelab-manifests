apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    # TEMP: shut down postgres cleanly for local-storage → metrics-storage move
    # (Intel 750 becomes the Talos boot disk). Flip to "off" in the repoint commit.
    cnpg.io/hibernation: "on"
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.7
  bootstrap:
    initdb:
      database: immich
      owner: immich
      dataChecksums: true
      encoding: UTF8
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  storage:
    size: 5Gi
    storageClass: immich-cnpg
  # Backup via the barman-cloud CNPG plugin (replaces deprecated in-tree
  # spec.backup.barmanObjectStore, which is removed in CNPG 1.29).
  # Destination + credentials live in the ObjectStore CR `immich-postgres-store`.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
  nodeMaintenanceWindow:
    inProgress: false
