apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    cnpg.io/hibernation: "off"
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17.7
  bootstrap:
    initdb:
      database: immich
      owner: immich
      dataChecksums: true
      encoding: UTF8
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  storage:
    size: 5Gi
    # Moved off the static local PV on the Samsung NVMe (immich-cnpg) to the
    # redundant SAS zpool via zfs-localpv, so the only must-retain data on that
    # disk is gone and it can be reformatted. storageClass is immutable on a
    # CNPG cluster, so this change requires deleting and recreating the cluster.
    storageClass: ssd-array
  # Backup via the barman-cloud CNPG plugin (replaces deprecated in-tree
  # spec.backup.barmanObjectStore, which is removed in CNPG 1.29).
  # Destination + credentials live in the ObjectStore CR `immich-postgres-store`.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
        # Clean archive path, overriding the default (the cluster name).
        #
        # Moving this cluster to ssd-array required deleting and recreating it
        # (storageClass is immutable on a CNPG cluster), so the new instance
        # began a fresh WAL timeline at 000000010000000000000001 while
        # s3://asandov-cnpg/immich-postgres/ still held the old cluster's
        # archive. barman refused every WAL push -
        #   "WAL archive check failed: Expected empty archive"
        # - and since base backups need working WAL archiving, each scheduled
        # backup wedged in `started` and blocked the next. Backups were dead
        # from the move until 2026-08-10.
        #
        # A new path fixes it without destroying the old archive, which is the
        # only pre-move backup that exists.
        serverName: immich-cnpg-talos
  nodeMaintenanceWindow:
    inProgress: false
