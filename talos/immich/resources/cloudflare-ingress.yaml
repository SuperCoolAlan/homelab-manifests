# Public host, reached via the jelly Oracle jumphost -> jellyfin-tunnel socat :30014 -> traefik `tunnel` entrypoint.
# Not Cloudflare: its 100 MB request limit breaks video uploads (docs/oracle-wireguard-jumphost.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-public
  namespace: immich
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: tunnel
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: photos.asandov.com
    http:
      paths:
      - backend:
          service:
            name: immich-server
            port:
              number: 2283
        path: /
        pathType: Prefix
