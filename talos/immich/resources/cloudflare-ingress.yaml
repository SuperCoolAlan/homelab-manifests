apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-cloudflare
  namespace: immich
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: photos.asandov.com
    http:
      paths:
      - backend:
          service:
            name: immich-server
            port:
              number: 2283
        path: /
        pathType: Prefix
