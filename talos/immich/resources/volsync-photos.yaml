# Off-site backup of the immich PHOTO LIBRARY (the actual image files).
#
# ⚠️ THIS IS NOT THE SAME AS THE CNPG BACKUP. cnpg-objectstore.yaml backs up
# immich's PostgreSQL database - albums, metadata, users, face recognition -
# which is 166 MB. The photos themselves are 22 GB of files on the
# immich-library-fast PVC and are NOT in Postgres. Restoring only the database
# gives you an immich that knows about every photo and has none of them.
#
# HISTORY: a restic job on TrueNAS backed these up daily at ~10:11 to
# s3://asandov-truenas/immich-photos - 30 snapshots, 2026-07-01 through
# 2026-07-30, then it stopped. Nothing replaced it, so from 2026-07-30 the photo
# library existed only on live storage. This re-homes that job into the cluster.
#
# NEW REPO, deliberately. The old bucket was named for a machine being
# decommissioned, so this starts fresh in s3://asandov-volsync/immich-photos.
# That costs a full 22 GB re-upload and loses the July snapshot history -
# accepted, because B2 does not charge for ingress (uploads are free, and
# b2_upload_file is a free Class A transaction), so the only real cost is
# wall-clock on the first run.
#
# Bucket is per-tool rather than per-app, mirroring asandov-cnpg: further
# VolSync sources get their own prefix in the same bucket, keeping the number of
# buckets and application keys flat as more apps are added.
#
# VolSync's restic mover runs `restic init` when the repository does not exist,
# so no manual setup is needed - the first run just takes a while.
#
# ⚠️ Keep s3://asandov-truenas until this repo has a verified snapshot. Those 30
# snapshots are the only historical photo backup that exists until then.
#
# PREREQUISITE - fill in secrets/immich-photos-restic.enc.yaml:
#
#   sops talos/immich/secrets/immich-photos-restic.enc.yaml
#
# RESTIC_REPOSITORY is pre-filled and correct. The other three are REPLACE_ME:
#
#   RESTIC_PASSWORD        new password for the new repo - restic init will use
#                          it. Do NOT reuse the old repo's password; it was
#                          exposed in plaintext.
#   AWS_ACCESS_KEY_ID      B2 keyID with WRITE on asandov-volsync. Must be a
#                          NON-master key - B2's S3 endpoint rejects master
#                          credentials outright.
#   AWS_SECRET_ACCESS_KEY  the matching applicationKey.
#
# pruneIntervalDays below also needs DELETE on the bucket. Without it backups
# keep succeeding and only prune fails, which is easy to miss - grant
# read+write+delete, or drop pruneIntervalDays.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-photos
  namespace: immich
spec:
  sourcePVC: immich-library-fast
  trigger:
    # 04:00 daily - after immich-postgres' 02:00 CNPG backup, so the two are not
    # competing for the same disks and uplink.
    schedule: "0 4 * * *"
  restic:
    repository: immich-photos-restic

    # Snapshot, NOT Direct. Direct fails outright against zfs-localpv: the
    # driver refuses a second mount of a volume even on the same node -
    #
    #   verifyMount: device already mounted at [...]
    #
    # - so the mover can never attach a PVC that immich-server already holds.
    # (The same limitation is why the media library has to be a static local: PV
    # rather than a zfs-localpv RWX claim.)
    #
    # Snapshot also gives a consistent point-in-time copy instead of reading a
    # live directory, and keeps the mover off immich's own volume entirely.
    copyMethod: Snapshot
    volumeSnapshotClassName: zfs-localpv-snapshot

    # Applies to the snapshot clone the mover mounts, not to immich's PVC.
    accessModes:
      - ReadWriteOnce
    storageClassName: ssd-array

    # restic needs scratch space for its local cache; without this it is sized
    # from the source PVC and is wastefully large.
    cacheCapacity: 4Gi
    cacheStorageClassName: fast-array

    retain:
      daily: 30
      weekly: 8
      monthly: 12

    # Prune rewrites the repo and needs DELETE on the bucket. If the B2 key is
    # write-only, prune fails while backups keep working - set the key up with
    # delete, or drop this and prune manually.
    pruneIntervalDays: 14
