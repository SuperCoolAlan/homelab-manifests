apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: immich-secret-generator
  annotations:
    config.kubernetes.io/function: |
        exec:
          path: ksops
files:
  - secrets/b2-asandov-cnpg-credentials.enc.yaml
  - secrets/immich-config.enc.yaml
  # Uncomment after filling in the REPLACE_ME values:
  #   sops talos/immich/secrets/immich-photos-restic.enc.yaml
  # Enabling it with placeholder values would start a VolSync mover that fails
  # to authenticate to B2 on every run.
  # - secrets/immich-photos-restic.enc.yaml
