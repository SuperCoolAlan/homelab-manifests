#
#   1. replace the four REPLACE_ME values below
#   2. sops --encrypt --in-place immich-photos-restic.PLAINTEXT-STUB.yaml
#   3. mv immich-photos-restic.PLAINTEXT-STUB.yaml immich-photos-restic.enc.yaml
#   4. add `- secrets/immich-photos-restic.enc.yaml` to
#      talos/immich/secrets-generator.yaml
#   5. add `- resources/volsync-photos.yaml` to talos/immich/kustomization.yaml
#
# Do not commit this file unencrypted. The .PLAINTEXT-STUB name is deliberately
# ugly so it is obvious if it ever shows up in `git status`.
#
# ---------------------------------------------------------------------------
# WHAT EACH VALUE IS
#
# RESTIC_REPOSITORY
#   Already correct below. Points at the EXISTING repo that the TrueNAS job
#   wrote 30 daily snapshots to (2026-07-01 .. 2026-07-30). Keeping this exact
#   path means VolSync appends to that history and reuses its deduplication
#   rather than re-uploading all 22 GB into a new repo.
#
# RESTIC_PASSWORD
#   The existing repo's password. If it is wrong, restic cannot open the repo -
#   it will not silently start a new one, it will just fail, which is the safe
#   failure mode.
#   NOTE: the value you pasted into chat earlier is compromised by being there.
#   restic supports multiple keys, so you can add a new one and revoke the old:
#     restic -r <repo> key add          # then `key list` / `key remove <id>`
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#   A B2 application key with WRITE access to asandov-truenas. The audit key is
#   read-only and will not work. Note the ReplicationSource sets
#   pruneIntervalDays: 14, and prune also needs DELETE - without it backups keep
#   working but prune fails. Grant read+write+delete, or drop pruneIntervalDays.
#   Must be a NON-master key: B2's S3 endpoint rejects master credentials.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: immich-photos-restic
  namespace: immich
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:https://s3.us-west-004.backblazeb2.com/asandov-truenas/immich-photos
  RESTIC_PASSWORD: REPLACE_ME_restic_repo_password
  AWS_ACCESS_KEY_ID: REPLACE_ME_b2_keyID_with_write_on_asandov_truenas
  AWS_SECRET_ACCESS_KEY: REPLACE_ME_b2_applicationKey
