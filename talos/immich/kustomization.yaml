apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: immich

resources:
  - namespace.yaml
  - resources/nfs-storage.yaml
  - resources/library-fast.yaml
  - resources/cnpg-objectstore.yaml
  - resources/cnpg-cluster.yaml
  - resources/cnpg-scheduled-backup.yaml
  - resources/volsync-photos.yaml
  - resources/ingress.yaml
  - resources/cloudflare-ingress.yaml

generators:
  - secrets-generator.yaml

helmCharts:
  - name: immich
    repo: https://immich-app.github.io/immich-charts
    version: 0.12.0
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml

