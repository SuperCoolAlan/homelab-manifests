apiVersion: v1
kind: Service
metadata:
  name: nvidia-gpu-exporter
  namespace: monitoring
  labels:
    app: nvidia-gpu-exporter
    io.kompose.service: nvidia-gpu-exporter
spec:
  type: ClusterIP
  selector:
    app: nvidia-gpu-exporter
  ports:
    - name: metrics
      port: 9835
      targetPort: metrics
      protocol: TCP
