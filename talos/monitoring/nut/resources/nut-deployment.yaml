# CyberPower CP1000AVRLCDa on talos-ramhaus USB. Only one pod may hold the device, hence Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nut
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nut
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nut
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      containers:
        - name: upsd
          image: instantlinux/nut-upsd:2.8.5-r1@sha256:a4a68e3c56081e3187621ee2a4bf9bce2936eaf0b628c01f81881f25cee0e667
          env:
            # NAME must match the ServiceMonitor's ups param and the liveness probe.
            - name: NAME
              value: cp1000
            - name: DESCRIPTION
              value: CyberPower CP1000AVRLCDa (ramhaus)
            - name: VENDORID
              value: "0764"
            - name: SERIAL
              value: CXKJZ2000885
            # Image README: CyberPower needs MAXAGE above the default or upsd marks data stale.
            - name: MAXAGE
              value: "25"
            # Monitoring only: never let the driver power off the UPS.
            - name: SDORDER
              value: "-1"
          ports:
            - name: nut
              containerPort: 3493
          securityContext:
            privileged: true
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "upsc cp1000@localhost:3493 2>&1 | grep -q stale && exit 1 || true"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # hostPath, not a device entry: the USB devnum changes on replug.
            - name: usb
              mountPath: /dev/bus/usb
            - name: password
              mountPath: /run/secrets/nut-upsd-password
              subPath: nut-upsd-password
              readOnly: true
        - name: exporter
          image: ghcr.io/druggeri/nut_exporter:3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
          args:
            # An empty list drops ups.status, which every OB/LB/RB alert in nut-vmrule.yaml depends on.
            - --nut.vars_enable=ups.status,ups.load,ups.power,ups.power.nominal,ups.realpower,ups.realpower.nominal,battery.charge,battery.charge.low,battery.charge.warning,battery.runtime,battery.runtime.low,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,input.transfer.low,input.transfer.high,output.voltage
          ports:
            - name: metrics
              containerPort: 9199
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        - name: password
          secret:
            secretName: nut-upsd-password
