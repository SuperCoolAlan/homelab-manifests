apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: aldo-rootdisk
  namespace: vms
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
  pvc:
    accessModes:
      - ReadWriteOnce
    # Block mode avoids NFS filesystem-permission issues (virt-launcher can't chown
    # files on an NFS share with shareMaproot=truenas_admin). democratic-csi creates
    # a sparse file on NFS and loopback-mounts it as a raw block device.
    volumeMode: Block
    resources:
      requests:
        storage: 100Gi
    storageClassName: truenas-nfs
