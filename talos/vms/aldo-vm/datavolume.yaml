apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: aldo-rootdisk
  namespace: vms
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
    storageClassName: truenas-nfs
