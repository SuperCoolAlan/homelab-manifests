apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: aldo-rootdisk
  namespace: vms
spec:
  source:
    # Pre-converted raw disk image from the kubevirt containerdisks project.
    # Avoids CDI's http→qemu-img-convert path which was failing on NFS scratch.
    registry:
      url: "docker://quay.io/containerdisks/ubuntu:24.04"
  pvc:
    accessModes:
      - ReadWriteOnce
    volumeMode: Filesystem
    resources:
      requests:
        storage: 100Gi
    # Static binding to the pre-provisioned NFS PV that has permissive
    # root mapping (needed for virt-launcher to chown the disk file).
    # Keeps permissive NFS settings scoped to this one share.
    storageClassName: nfs
    volumeName: aldo-rootdisk-pv
