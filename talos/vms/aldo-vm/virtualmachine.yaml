apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: aldo
  namespace: vms
  labels:
    app: aldo-vm
spec:
  # PHASE4-QUIESCE: halted for the TrueNAS disk swap. aldo-rootdisk is an NFS
  # PVC on truenas.asandov.local, and this is a VM, not a Deployment - pulling
  # storage out from under a running guest is the same class of event as yanking
  # a disk out of a physical machine. Halting cleanly is not optional here.
  #
  # `running: false` performs a graceful ACPI shutdown; watch for the VMI to
  # disappear (kubectl get vmi -n vms) before exporting the pool, since Argo
  # sets the intent but the guest takes time to actually stop.
  #
  # Restore to true alongside pv-local.yaml.staged. Grep PHASE4-QUIESCE.
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/vm: aldo
        app: aldo-vm
    spec:
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 1
        resources:
          requests:
            memory: 16Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
          networkInterfaceMultiqueue: true
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: aldo-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: aldo-cloud-init
