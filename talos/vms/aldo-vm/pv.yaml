apiVersion: v1
kind: PersistentVolume
metadata:
  name: aldo-rootdisk-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  volumeMode: Filesystem
  # Explicit mount options so qemu-img convert's I/O syscalls behave on NFS.
  # vers=4.2 gives proper O_DIRECT and fallocate support; hard + timeo avoids
  # the importer failing on transient NFS hiccups during a big write.
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - timeo=600
    - retrans=2
    - rsize=1048576
    - wsize=1048576
  # Pre-bound to the VM's DataVolume-generated PVC so CDI uses this specific share.
  claimRef:
    namespace: vms
    name: aldo-rootdisk
  nfs:
    server: truenas.asandov.local
    path: /mnt/ST6000NM0095-pool0/media/nfs/vms/aldo-rootdisk
