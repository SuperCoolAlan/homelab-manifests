apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: garage

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - pvc.yaml
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  - name: garage-config
    files:
      - garage.toml

generators:
  - secrets-generator.yaml
