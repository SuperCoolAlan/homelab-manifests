# Public host, reached via cloudflared -> traefik `tunnel` entrypoint
# (see cluster-services/traefik/resources/public-tunnel-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-public
  namespace: mealie
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: tunnel
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mealie.asandov.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie-local-asandov
  namespace: mealie
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: mealie.local.asandov.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
  tls:
    - hosts:
        - mealie.local.asandov.com
      secretName: mealie-local-tls
