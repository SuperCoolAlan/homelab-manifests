apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  # RWO zfs-localpv volume: a surge pod can't mount it while the old pod runs ("device already mounted").
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          # renovate: datasource=docker depName=ghcr.io/mealie-recipes/mealie
          image: ghcr.io/mealie-recipes/mealie:v3.28.0
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: BASE_URL
              value: "https://mealie.asandov.com"
            - name: TZ
              value: "America/Chicago"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: "https://auth.asandov.com/application/o/mealie/.well-known/openid-configuration"
            - name: OIDC_PROVIDER_NAME
              value: "Authentik"
            # authentik users can edit their own email, so match on the immutable username instead.
            - name: OIDC_USER_CLAIM
              value: "preferred_username"
            # authentik's email scope always sends email_verified=false; safe only while matching on username.
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: "false"
            - name: OIDC_ADMIN_GROUP
              value: "authentik Admins"
            - name: OIDC_REMEMBER_ME
              value: "true"
          envFrom:
            - secretRef:
                name: mealie-oidc
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /app/data
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
