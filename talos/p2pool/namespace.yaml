# Privileged only for the turbo-off sidecar, which writes node sysfs. p2pool itself runs unprivileged.
apiVersion: v1
kind: Namespace
metadata:
  name: p2pool
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
