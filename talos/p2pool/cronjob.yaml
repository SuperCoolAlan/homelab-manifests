# OG&E Time-of-Day: on-peak is 14:00-19:00 Central, June-October only. Outside
# those months the start job never fires a stop, so mining runs around the clock.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p2pool-scheduler
  namespace: p2pool
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p2pool-scheduler
  namespace: p2pool
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: ["p2pool"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p2pool-scheduler
  namespace: p2pool
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p2pool-scheduler
subjects:
  - kind: ServiceAccount
    name: p2pool-scheduler
    namespace: p2pool
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: p2pool-peak-stop
  namespace: p2pool
spec:
  schedule: "0 14 * 6-10 *"
  timeZone: America/Chicago
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: p2pool-scheduler
          restartPolicy: OnFailure
          # no_turbo is per-node sysfs; this must land on the node p2pool mines on.
          nodeSelector:
            kubernetes.io/hostname: talos-ramhaus
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The only privileged code in p2pool: a few seconds twice a day. Talos machine.sysfs sets no_turbo=1 at boot.
            - name: turbo-on
              # renovate: datasource=docker depName=busybox
              image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              command: ["/bin/sh", "-c", "echo 0 > /sys/devices/system/cpu/intel_pstate/no_turbo && echo turbo on"]
              securityContext:
                privileged: true
                runAsUser: 0
                runAsNonRoot: false
              resources:
                requests:
                  cpu: 1m
                  memory: 4Mi
                limits:
                  memory: 16Mi
          containers:
            - name: scale
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.33.13@sha256:a179e6c6f0b87263426fe2a793412c422999d55ffb06d7bc069635468aba3324
              args: ["scale", "deployment/p2pool", "--replicas=0"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: p2pool-peak-start
  namespace: p2pool
spec:
  schedule: "0 19 * 6-10 *"
  timeZone: America/Chicago
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: p2pool-scheduler
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: talos-ramhaus
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Runs before the scale-up so mining never starts with turbo on.
            - name: turbo-off
              # renovate: datasource=docker depName=busybox
              image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              command: ["/bin/sh", "-c", "echo 1 > /sys/devices/system/cpu/intel_pstate/no_turbo && echo turbo off"]
              securityContext:
                privileged: true
                runAsUser: 0
                runAsNonRoot: false
              resources:
                requests:
                  cpu: 1m
                  memory: 4Mi
                limits:
                  memory: 16Mi
          containers:
            - name: scale
              # renovate: datasource=docker depName=registry.k8s.io/kubectl
              image: registry.k8s.io/kubectl:v1.33.13@sha256:a179e6c6f0b87263426fe2a793412c422999d55ffb06d7bc069635468aba3324
              args: ["scale", "deployment/p2pool", "--replicas=1"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
