# P2Pool mini sidechain node plus its built-in RandomX miner, mining against our
# own monerod. One process, one 2 GiB dataset - no separate xmrig.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2pool
  namespace: p2pool
spec:
  # No `replicas`: cronjob.yaml owns it. Adding it here makes Argo selfHeal undo every scheduled stop.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: p2pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p2pool
    spec:
      # The turbo toggle and the economics in README.md are for this CPU (E5-1660 v4).
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Turbo is not managed here: Talos sets no_turbo=1 at boot and cronjob.yaml flips it around the peak pause.
      initContainers:
        - name: wg-up
          # Used only for `wg` and `ip`; the s6 entrypoint is bypassed.
          # renovate: datasource=docker depName=linuxserver/wireguard versioning=loose
          image: linuxserver/wireguard:1.0.20260223@sha256:dca67384e3e9a5bcc288461fa983e6fcb0e248e5a2d8e5b3e5d3f753bfac3e35
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add: ["NET_ADMIN"]
          command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 077
              GW=$(ip -4 route show default | awk '{print $3}')
              # Only the private key is secret; the rest is public and stays readable here.
              cat > /tmp/wg.conf <<EOF
              [Interface]
              PrivateKey = $(cat /secrets/privatekey)

              [Peer]
              PublicKey = rE+qZRl4LnX8iG4wUTUxj+jVRMhqLlvP8kpH8vrzMQM=
              AllowedIPs = 0.0.0.0/0
              Endpoint = 147.224.205.227:51820
              PersistentKeepalive = 25
              EOF
              ip link del wg0 2>/dev/null || true
              ip link add wg0 type wireguard
              wg setconf wg0 /tmp/wg.conf
              rm -f /tmp/wg.conf
              # 10.100.0.4 is hardcoded in the jumphost's p2pool DNAT/masquerade/FORWARD rules and wg0.conf peer.
              ip address add 10.100.0.4/32 dev wg0
              # 1370 = flannel VXLAN eth0 (1450) - 80 WG overhead; keep jumphost wg0 equal.
              ip link set wg0 mtu 1370 up
              # monerod RPC/ZMQ, DNS, probes and metrics scrapes stay on eth0; without these p2pool loses its node.
              ip route replace 10.0.0.0/8 via "$GW" dev eth0
              ip route replace 147.224.205.227/32 via "$GW" dev eth0
              # Sidechain egress exits the jumphost so peers learn a dialable address. Fails closed if the tunnel is down.
              ip route replace default dev wg0
              wg show wg0
          volumeMounts:
            - name: wg-key
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: p2pool
          # renovate: datasource=docker depName=ghcr.io/sethforprivacy/p2pool
          image: ghcr.io/sethforprivacy/p2pool:v4.18@sha256:53b6a88aff43c7f165066c4e918fea250fabd0afccee7e07a020dff3ce605de7
          workingDir: /data
          command: ["/bin/sh", "-c", "mkdir -p /data/api && exec p2pool \"$@\"", "p2pool"]
          args:
            - --host
            - monerod-rpc.monerod.svc.cluster.local
            - --rpc-port
            - "18089"
            - --zmq-port
            - "18083"
            # Public by design. Shares publish it on the p2pool sidechain, so use a mining-only wallet.
            - --wallet
            - 44g6Qrx8kFHQY4NGAsnE2yPRfxT9pKVp8Nrk3Lc76oRb1KNxeESgaXu4V2aPbh5DnA49DWajByQCs46Yg5aNNsUxT31hZ6J
            - --mini
            # 8 = physical cores. 10 measured slower (3412 vs 3525 H/s) and never left the startup chain.
            - --start-mining
            - "8"
            - --data-dir
            - /data
            - --data-api
            - /data/api
            - --local-api
            - --no-upnp
            - --no-color
            # stdout already reaches VictoriaLogs; the on-disk log grows ~100 MB/day unrotated and would fill the PVC.
            - --no-log-file
          ports:
            - name: stratum
              containerPort: 3333
            - name: p2p
              containerPort: 37888
          # Dataset init takes a minute or two before stratum binds.
          startupProbe:
            tcpSocket:
              port: stratum
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: stratum
            periodSeconds: 60
            failureThreshold: 5
          resources:
            # Must fit ramhaus's vm.nr_hugepages=1400 (2800Mi); larger and the pod never schedules.
            # The RandomX dataset moves into huge pages, so memory drops accordingly.
            # No CPU limit: a quota at thread count throttled ~69% of periods (miner + p2pool housekeeping).
            # The request still sets the contention share, so mining yields to other ramhaus workloads.
            requests:
              cpu: "4"
              memory: 1Gi
              hugepages-2Mi: 2800Mi
            limits:
              memory: 2Gi
              hugepages-2Mi: 2800Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: stats-httpd
          # Serves p2pool's --data-api JSON to json-exporter. Loopback only; nothing else should read it.
          # renovate: datasource=docker depName=busybox
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["httpd", "-f", "-p", "127.0.0.1:8081", "-h", "/data/api"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
        - name: json-exporter
          # /probe takes an arbitrary ?target= URL; the Service must stay ClusterIP (no NetworkPolicy guards it).
          # renovate: datasource=docker depName=quay.io/prometheuscommunity/json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
          args:
            - --config.file=/config/json-exporter.yml
            - --web.listen-address=:7979
          ports:
            - name: metrics
              containerPort: 7979
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: json-exporter-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: wg-key
          secret:
            secretName: p2pool-wg-key
            defaultMode: 0400
        - name: json-exporter-config
          configMap:
            name: p2pool-json-exporter
        # Recreate strategy is required: RWO zfs-localpv refuses a second mount, so a rolling update would deadlock.
        - name: data
          persistentVolumeClaim:
            claimName: p2pool-data
