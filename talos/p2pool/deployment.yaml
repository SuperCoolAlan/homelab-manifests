# P2Pool mini sidechain node plus its built-in RandomX miner, mining against our
# own monerod. One process, one 2 GiB dataset - no separate xmrig.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2pool
  namespace: p2pool
spec:
  # No `replicas`: cronjob.yaml owns it. Adding it here makes Argo selfHeal undo every scheduled stop.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: p2pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p2pool
    spec:
      # The turbo toggle and the economics in README.md are for this CPU (E5-1660 v4).
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: turbo-off
          image: busybox:1.37.0
          # Native sidecar: stops after p2pool, so the restore runs last. Node-wide - turbo is off only while mining.
          restartPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              f=/sys/devices/system/cpu/intel_pstate/no_turbo
              echo 1 > "$f" && echo "turbo off"
              trap 'echo 0 > "$f"; echo "turbo restored"; exit 0' TERM INT
              while :; do sleep 3600 & wait $!; done
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
      containers:
        - name: p2pool
          # renovate: datasource=docker depName=ghcr.io/sethforprivacy/p2pool
          image: ghcr.io/sethforprivacy/p2pool:v4.18
          workingDir: /data
          command: ["/bin/sh", "-c", "mkdir -p /data/api && exec p2pool \"$@\"", "p2pool"]
          args:
            - --host
            - monerod-rpc.monerod.svc.cluster.local
            - --rpc-port
            - "18089"
            - --zmq-port
            - "18083"
            # Public by design. Shares publish it on the p2pool sidechain, so use a mining-only wallet.
            - --wallet
            - 44g6Qrx8kFHQY4NGAsnE2yPRfxT9pKVp8Nrk3Lc76oRb1KNxeESgaXu4V2aPbh5DnA49DWajByQCs46Yg5aNNsUxT31hZ6J
            - --mini
            # 8 = physical cores. 10 measured slower (3412 vs 3525 H/s) and never left the startup chain.
            - --start-mining
            - "8"
            - --data-dir
            - /data
            - --data-api
            - /data/api
            - --local-api
            - --no-upnp
            - --no-color
            # stdout already reaches VictoriaLogs; the on-disk log grows ~100 MB/day unrotated and would fill the PVC.
            - --no-log-file
          ports:
            - name: stratum
              containerPort: 3333
            - name: p2p
              containerPort: 37888
          # Dataset init takes a minute or two before stratum binds.
          startupProbe:
            tcpSocket:
              port: stratum
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: stratum
            periodSeconds: 60
            failureThreshold: 5
          resources:
            # Must fit ramhaus's vm.nr_hugepages=1400 (2800Mi); larger and the pod never schedules.
            # The RandomX dataset moves into huge pages, so memory drops accordingly.
            # No CPU limit: a quota at thread count throttled ~69% of periods (miner + p2pool housekeeping).
            # The request still sets the contention share, so mining yields to other ramhaus workloads.
            requests:
              cpu: "4"
              memory: 1Gi
              hugepages-2Mi: 2800Mi
            limits:
              memory: 2Gi
              hugepages-2Mi: 2800Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: stats-httpd
          # Serves p2pool's --data-api JSON to json-exporter. Loopback only; nothing else should read it.
          image: busybox:1.37.0
          command: ["httpd", "-f", "-p", "127.0.0.1:8081", "-h", "/data/api"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
        - name: json-exporter
          # /probe takes an arbitrary ?target= URL; the Service must stay ClusterIP (flannel enforces no NetworkPolicy).
          # renovate: datasource=docker depName=quay.io/prometheuscommunity/json-exporter
          image: quay.io/prometheuscommunity/json-exporter:v0.8.0
          args:
            - --config.file=/config/json-exporter.yml
            - --web.listen-address=:7979
          ports:
            - name: metrics
              containerPort: 7979
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: json-exporter-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: json-exporter-config
          configMap:
            name: p2pool-json-exporter
        # Recreate strategy is required: RWO zfs-localpv refuses a second mount, so a rolling update would deadlock.
        - name: data
          persistentVolumeClaim:
            claimName: p2pool-data
