# Scrape target for servicemonitor.yaml. Keep ClusterIP: json-exporter's /probe will fetch any URL it is given.
apiVersion: v1
kind: Service
metadata:
  name: p2pool-metrics
  namespace: p2pool
  labels:
    app.kubernetes.io/name: p2pool
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: p2pool
  ports:
    - name: metrics
      port: 7979
      targetPort: metrics
