apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: talos-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/SuperCoolAlan/homelab-manifests.git
        revision: HEAD
        directories:
          # ArgoCD self-management: the argo-cd chart, this ApplicationSet,
          # and the ingress sync from git like everything else. Bootstrap
          # (and recovery if the app is ever deleted) is a manual
          # `kubectl apply -f talos/argocd/resources/applicationset.yaml`.
          - path: talos/argocd
          # Cluster services
          - path: talos/cluster-services/*
          # Monitoring sub-apps
          - path: talos/monitoring/*
          # Authentik
          - path: talos/authentik
          # Actualbudget (previously a hand-made Application; adopted by
          # the appset — see PR #18 bootstrap notes)
          - path: talos/actualbudget
          # Media apps
          - path: talos/media-v2
          - path: talos/qbittorrent
          # Tracearr
          - path: talos/tracearr
          # Maintainerr
          - path: talos/maintainerr
          # Piper (TTS)
          - path: talos/piper
          # Status page
          - path: talos/status
          # Twingate
          - path: talos/twingate
          # Immich (photo management)
          - path: talos/immich
          # Security scanning
          - path: talos/security/*
          # Virtual machines (KubeVirt)
          - path: talos/vms/*
  template:
    metadata:
      name: '{{.path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/SuperCoolAlan/homelab-manifests.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /status
            - /spec/conversion/webhook/clientConfig/caBundle
        - kind: Secret
          name: vm-grafana
          jsonPointers:
            - /data/admin-password
        - kind: Secret
          name: vm-victoria-metrics-operator-validation
          jsonPointers:
            - /data
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: vm-victoria-metrics-operator-admission
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
