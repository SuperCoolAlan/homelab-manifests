apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: status

resources:
  - namespace.yaml
  - ingress.yaml
  - pvc-fast.yaml
  - pvc-ssd.yaml

patches:
  - target:
      kind: Deployment
      name: gatus
    path: quiesce.yaml

helmCharts:
  - name: gatus
    repo: https://twin.github.io/helm-charts
    version: 1.5.0
    releaseName: gatus
    namespace: status
    valuesInline:
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      persistence:
        enabled: true
        size: 1Gi
        # Migrated off TrueNAS NFS 2026-08-09; the legacy `gatus` claim was
        # dropped 2026-08-10 with the TrueNAS decommission. Its PV is Retain so
        # the original sqlite history survives on the imported pool, but the
        # server that exported it is gone, so the claim could not rebind.
        existingClaim: gatus-data-fast
      serviceMonitor:
        enabled: true
      config:
        storage:
          type: sqlite
          path: /data/gatus.db
        ui:
          title: "asandov.com Status"
          header: "Service Status"
        endpoints:
          # Public services
          - name: Authentik
            group: Public
            url: https://auth.asandov.com
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          - name: Jellyseerr
            group: Public
            url: https://jellyseerr.asandov.com
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          # Exercises the full Cloudflare -> traefik -> pod path. Paired with
          # the internal check below: if this fails while that one passes, the
          # problem is ingress or DNS, not jellyfin.
          - name: Jellyfin
            group: Public
            url: https://jellyfin.asandov.com
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          # Media stack (internal)
          - name: Sonarr
            group: Media
            url: http://sonarr.media-v2.svc.cluster.local:8989/ping
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          - name: Radarr
            group: Media
            url: http://radarr.media-v2.svc.cluster.local:7878/ping
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          - name: Prowlarr
            group: Media
            url: http://prowlarr.media-v2.svc.cluster.local:9696/ping
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          - name: SABnzbd
            group: Media
            url: http://sabnzbd.media-v2.svc.cluster.local:8080
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          - name: Bazarr
            group: Media
            url: http://bazarr.media-v2.svc.cluster.local:6767
            interval: 60s
            conditions:
              - "[STATUS] == 200"
          # /health returns the literal body "Healthy", so this asserts on the
          # body as well as the status - jellyfin can answer 200 on / while the
          # library database is still loading.
          #
          # Worth watching specifically since the 2026-08-10 cutover: jellyfin
          # mounts media-library, a local: PV bind-mounted from /var/mnt/media.
          # If the ZFS dataset is ever not mounted when the pod starts, kubelet
          # binds an empty directory and jellyfin comes up "healthy" with an
          # empty library - this check would still pass, so treat it as a
          # liveness signal, not a proof the media is there.
          - name: Jellyfin
            group: Media
            url: http://jellyfin.jellyfin.svc.cluster.local:8096/health
            interval: 60s
            conditions:
              - "[STATUS] == 200"
              - "[BODY] == Healthy"
          # Infrastructure
          #
          # The `NFS` (tcp://truenas.asandov.local:2049) and `TrueNAS`
          # (https://truenas.asandov.local) checks were removed 2026-08-10 with
          # the decommission. Nothing in the cluster mounts NFS any more - the
          # media library and every app config now live on local ZFS - so those
          # two would page on a box that is deliberately switched off.
          - name: Kubernetes API
            group: Infrastructure
            url: https://kubernetes.default.svc.cluster.local:443
            interval: 30s
            client:
              insecure: true
            conditions:
              - "[STATUS] == any(200, 401, 403)"
          - name: Victoria Metrics
            group: Infrastructure
            url: http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/health
            interval: 30s
            conditions:
              - "[STATUS] == 200"
          - name: VMAgent
            group: Infrastructure
            url: http://vmagent-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/health
            interval: 30s
            conditions:
              - "[STATUS] == 200"
          - name: VMAlert
            group: Infrastructure
            url: http://vmalert-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8080/health
            interval: 30s
            conditions:
              - "[STATUS] == 200"
          - name: Victoria Logs
            group: Infrastructure
            url: http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/health
            interval: 30s
            conditions:
              - "[STATUS] == 200"
          # Checks the lab resolver at 10.0.1.1, not the record's subject. The
          # query name was truenas.asandov.local until 2026-08-10; it moved to
          # ldap.asandov.local rather than being deleted, because losing this
          # would mean no DNS monitoring at all. ldap.asandov.local is managed
          # by external-dns-opnsense from talos/authentik/resources/ldap-dns.yaml,
          # so it exists for as long as the cluster publishes it - update this if
          # the LDAP outpost is ever retired.
          - name: Lab DNS
            group: Infrastructure
            url: 10.0.1.1
            interval: 30s
            dns:
              query-name: ldap.asandov.local
              query-type: A
            conditions:
              - "[DNS_RCODE] == NOERROR"
          - name: Cloudflare DNS
            group: Infrastructure
            url: 1.1.1.1
            interval: 30s
            dns:
              query-name: cloudflare.com
              query-type: A
            conditions:
              - "[DNS_RCODE] == NOERROR"
