# The original chart-created `gatus` PVC, transcribed verbatim from the live
# object so Argo sees it as in-sync.
#
# Once persistence.existingClaim points at gatus-data-fast, the chart stops
# rendering this PVC - and with prune: true Argo would delete it. Its PV is
# Retain so the data would survive, but the PV would go Released and need its
# claimRef cleared by hand before it could be rebound. Declaring it here keeps
# rollback to a one-line existingClaim change instead.
#
# Delete this file (and gatus-data-nfs) once the migration has soaked.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus
  namespace: status
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  volumeName: gatus-data-nfs
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
