# Replacement for the chart-created `gatus` PVC (storageClassName: nfs,
# TrueNAS-backed). storageClassName is immutable, so the migration to local ZFS
# goes via a second claim which the chart then adopts by existingClaim.
#
# Data is copied by a one-shot Job while the deployment sits at replicas: 0 -
# gatus keeps its history in sqlite at /data/gatus.db, which must not be
# copied live.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gatus-data-fast
  namespace: status
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 1Gi
