apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: haos
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haos
    spec:
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        machine:
          type: q35
        # the HAOS image only boots via UEFI
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              macAddress: "6a:c5:38:84:cc:e1"
              ports:
                - name: http
                  port: 80
                  protocol: TCP
            # VLAN 67; MAC pinned so HAOS keeps its static-IP profile on this NIC
            - name: iot
              bridge: {}
              macAddress: "02:00:0a:00:43:02"
      networks:
        - name: default
          pod: {}
        - name: iot
          multus:
            networkName: iot
      volumes:
        - name: rootdisk
          dataVolume:
            name: haos-rootdisk
