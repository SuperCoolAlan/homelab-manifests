apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: haos
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haos
    spec:
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: talos-ramhaus
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        machine:
          type: q35
        # the HAOS image only boots via UEFI
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: http
                  port: 8123
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: haos-rootdisk
