# 8123 kept for clients; HAOS serves on 80 (its http settings) and only redirects 8123 to :80, which masquerade does not forward.
apiVersion: v1
kind: Service
metadata:
  name: haos
  annotations:
    metallb.io/loadBalancerIPs: 10.0.7.205
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: haos
  ports:
    - name: http
      port: 8123
      targetPort: 80
      protocol: TCP
