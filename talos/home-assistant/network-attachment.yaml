# L2 onto VLAN 67 via ramhaus's br67 (Talos machine config). No IPAM: HAOS sets 10.0.67.2/24 statically, with no gateway, so its default route stays on the pod NIC.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "type": "bridge",
      "bridge": "br67",
      "ipam": {}
    }
