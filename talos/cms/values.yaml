# bjw-s app-template; defaults in the chart's charts/common/values.yaml.
controllers:
  cms:
    # Payload runs migrations on boot with no cross-pod lock, so never run two pods at once.
    replicas: 1
    strategy: Recreate
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: ghcr.io/supercoolalan/family-sites-cms
          # renovate: datasource=docker depName=ghcr.io/supercoolalan/family-sites-cms
          tag: "0.1.0"
        env:
          SERVER_URL: https://cms.asandov.com
          CORS_ORIGINS: https://fuelmechanical.asandov.com,https://poniesdesserts.asandov.com
          OIDC_ENABLED: "true"
          OIDC_ISSUER: https://auth.asandov.com/application/o/cms/
          S3_BUCKET: cms-asandov-com
          S3_REGION: auto
          MEDIA_PUBLIC_URL: https://media.asandov.com
          TZ: America/Chicago
          DATABASE_URI:
            valueFrom:
              secretKeyRef:
                name: cms-postgres-app
                key: uri
        envFrom:
          - secretRef:
              name: cms-payload
          - secretRef:
              name: cms-oidc
          # S3_ENDPOINT/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY/TURNSTILE_SECRET_KEY; optional so the admin runs before R2 exists (uploads and forms fail until then)
          - secretRef:
              name: cms-r2
              optional: true
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 10
          # first boot applies migrations before the server listens
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 3000
              periodSeconds: 10
              failureThreshold: 60
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: cms
    ports:
      http:
        port: 3000

ingress:
  # Public host via cloudflared -> traefik `tunnel` entrypoint (see cluster-services/traefik/resources/public-tunnel-ingress.yaml).
  public:
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tunnel
      traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer@kubernetescrd
    hosts:
      - host: cms.asandov.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
  local:
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: cms.local.asandov.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - cms.local.asandov.com
        secretName: cms-local-tls

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  next-cache:
    type: emptyDir
    globalMounts:
      - path: /app/.next/cache
