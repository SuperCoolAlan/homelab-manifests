apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cms-postgres-daily
  namespace: cms
spec:
  # 6-field cron (sec first); a 5-field string fires hourly.
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: cms-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
