# One-off staging environment for the torrent hardlink migration.
# NOT Argo-managed — apply/delete by hand (see docs/torrent-hardlink-migration.md):
#   kubectl --kubeconfig ~/.kube/clusters/homelab.yaml apply -f staging.yaml
#   kubectl -n torrent-staging create configmap stage-script --from-file=stage.py
#   then apply job.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: torrent-staging
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: staging-qbt-store
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: truenas.asandov.local
    path: /mnt/ST6000NM0095-pool0/media/nfs/v/pvc-58505e09-9b30-4da7-8ff0-2ef8f6eeac9f
  mountOptions: [noatime, nfsvers=4, ro]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbt-store
  namespace: torrent-staging
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: staging-qbt-store
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: staging-media
spec:
  capacity:
    storage: 5Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: truenas.asandov.local
    path: /mnt/ST6000NM0095-pool1/media
  mountOptions: [noatime, nfsvers=4]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: torrent-staging
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: staging-media
  resources:
    requests:
      storage: 5Ti
