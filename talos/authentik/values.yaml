authentik:
  # Secret key loaded from secret via envFrom
  secret_key: ""
  error_reporting:
    enabled: false

  postgresql:
    host: "truenas.asandov.local"
    port: 5432
    name: "authentik"
    user: "authentik"
    password: ""  # loaded via envFrom

  email:
    host: "smtp.zoho.com"
    port: 587
    use_tls: true
    use_ssl: false
    timeout: 30
    from: "authentik@asandov.com"  # set your from address
    # username/password loaded via envFrom

global:
  envFrom:
    - secretRef:
        name: authentik-secrets

# Disable the bundled PostgreSQL. Despite the previous "using CNPG" note here,
# authentik has never had a CNPG cluster - authentik.postgresql.host above
# points at a Postgres running on the TrueNAS box. The unused authentik-cnpg
# StorageClass and its two PVs were removed 2026-08-09.
postgresql:
  enabled: false

# Enable bundled Redis
redis:
  enabled: true

server:
  # TEMPORARY (zero-divergence Postgres cutover, 2026-08-09): held at 0 so no
  # further writes reach the TrueNAS database while the CNPG cluster re-imports
  # from a quiesced source. Restored to 1 in the commit that flips
  # authentik.postgresql.host to the in-cluster service.
  replicas: 0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - authentik.asandov.local
    tls: []

worker:
  # TEMPORARY (zero-divergence Postgres cutover, 2026-08-09): held at 0 so no
  # further writes reach the TrueNAS database while the CNPG cluster re-imports
  # from a quiesced source. Restored to 1 in the commit that flips
  # authentik.postgresql.host to the in-cluster service.
  replicas: 0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
