apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - resources/cnpg-cluster.yaml
  # resources/cnpg-objectstore.yaml and resources/cnpg-scheduled-backup.yaml are
  # committed but intentionally NOT listed here - they need the
  # cnpg-b2-asandov-credentials secret in this namespace first. See the comment
  # block in cnpg-cluster.yaml.
  - resources/traefik-middleware.yaml
  - resources/cloudflare-ingress.yaml
  - resources/ldap-ingressroute.yaml
  - resources/ldap-dns.yaml
  - resources/local-asandov-ingress.yaml

generators:
  - secrets-generator.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.5.6
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml
