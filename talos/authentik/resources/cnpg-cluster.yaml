# authentik's Postgres. Traefik middlewares across media-v2, maintainerr and
# others route through authentik-authentik@kubernetescrd, so this cluster is on
# the path of authenticated access to most services.
#
# bootstrap only runs at cluster creation; editing it does nothing to a live cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
  annotations:
    cnpg.io/hibernation: "off"
spec:
  instances: 3
  # Plain CNPG image - authentik needs no extensions beyond plpgsql, unlike
  # immich which needs vectorchord.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      dataChecksums: true
      encoding: UTF8
      # authentik's own credentials (kubernetes.io/basic-auth), not a CNPG-generated secret.
      secret:
        name: authentik-postgres-credentials

  storage:
    # 139 MB today. 10Gi leaves room without being silly; ssd-array supports
    # expansion, and storageClass is immutable on a CNPG cluster so the class
    # choice is the one thing worth getting right up front.
    size: 10Gi
    # raidz2 across 4x 480G SAS SSD. Same class immich-postgres already runs on.
    storageClass: ssd-array

  # Backup via the barman-cloud plugin, same pattern as immich. Requires the
  # cnpg-b2-asandov-credentials secret in this namespace - with
  # isWALArchiver: true and no credentials, WAL archiving fails continuously and
  # WAL accumulates on the PVC.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres-store

  nodeMaintenanceWindow:
    inProgress: false
