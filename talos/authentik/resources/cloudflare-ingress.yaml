# Public host, reached via cloudflared -> traefik `tunnel` entrypoint
# (see cluster-services/traefik/resources/public-tunnel-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-public
  namespace: authentik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: tunnel
spec:
  ingressClassName: traefik
  rules:
  - host: auth.asandov.com
    http:
      paths:
      - backend:
          service:
            name: authentik-server
            port:
              number: 80
        path: /
        pathType: Prefix
