# OIDC provider that lets Cloudflare Access (team "asandov") use authentik as a login method.
# Client id/secret come from the cloudflare-access-oidc secret via envFrom; the same pair is
# configured on the Cloudflare side (Zero Trust > Settings > Authentication > OpenID Connect).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-cloudflare-access
  namespace: authentik
data:
  cloudflare-access.yaml: |
    version: 1
    metadata:
      name: cloudflare-access
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: cloudflare-access
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env CLOUDFLARE_ACCESS_CLIENT_ID
          client_secret: !Env CLOUDFLARE_ACCESS_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://asandov.cloudflareaccess.com/cdn-cgi/access/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: cloudflare-access
        attrs:
          name: Cloudflare Access
          provider: !KeyOf provider
          # not something users launch; keep it off the authentik app dashboard
          meta_launch_url: blank://blank
