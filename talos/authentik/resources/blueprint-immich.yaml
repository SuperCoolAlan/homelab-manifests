# OIDC provider for Immich. Client id/secret come from the immich-oidc secret via envFrom;
# the same pair is in talos/immich/secrets/immich-config.enc.yaml (oauth.clientId/clientSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-immich
  namespace: authentik
data:
  immich.yaml: |
    version: 1
    metadata:
      name: immich
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        # Matches the hand-made provider by name so it is updated in place; renaming it here creates a second provider.
        identifiers:
          name: Immich photos.asandov.com
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env IMMICH_OIDC_CLIENT_ID
          client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: regex
              url: https://photos\.asandov\.com.*
            - matching_mode: regex
              url: https://photos\.local\.asandov\.com/.*
            # Mobile app callback (oauth.mobileOverrideEnabled is false in the Immich config).
            - matching_mode: strict
              url: app.immich:///oauth-callback
          logout_uri: https://photos.asandov.com/
          logout_method: backchannel
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: immich
        attrs:
          name: Immich photos.asandov.com
          provider: !KeyOf provider
          meta_launch_url: https://photos.asandov.com/
