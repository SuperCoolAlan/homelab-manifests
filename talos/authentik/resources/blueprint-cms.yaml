# OIDC provider for the family-sites Payload CMS. Client id/secret come from the cms-oidc secret via envFrom;
# the same pair is in talos/cms/secrets/cms-oidc.enc.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-cms
  namespace: authentik
data:
  cms.yaml: |
    version: 1
    metadata:
      name: cms
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: provider
        identifiers:
          name: cms
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # empty by default on blueprint-created providers; without it the token endpoint rejects the code exchange
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env CMS_OIDC_CLIENT_ID
          client_secret: !Env CMS_OIDC_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://cms.asandov.com/api/users/oauth/callback
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          # Payload matches users on sub, so it must stay stable per user
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: cms
        attrs:
          name: Family Sites CMS
          provider: !KeyOf provider
          meta_launch_url: https://cms.asandov.com/admin
