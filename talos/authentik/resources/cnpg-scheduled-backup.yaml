apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgres-daily
  namespace: authentik
spec:
  # 6-field cron (sec min hour dom mon dow) — CNPG's parser expects 6 fields.
  # A 5-field expression like "0 3 * * *" gets read as sec=0 min=3 hour=* …
  # which fires hourly at HH:03. Same trap documented for immich's schedule.
  # Offset an hour from immich's 02:00 so the two do not contend.
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
