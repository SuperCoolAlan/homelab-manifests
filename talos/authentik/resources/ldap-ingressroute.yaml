# Expose Authentik LDAP outpost via Traefik for clients outside the cluster
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: authentik-ldap
  namespace: authentik
spec:
  entryPoints:
    - ldap
  routes:
    - match: HostSNI(`*`)
      services:
        - name: ak-outpost-ldap
          port: 389
