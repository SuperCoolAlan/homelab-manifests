# Insert-only gate in front of VictoriaLogs: 9428 also serves the query and delete APIs, which the Oracle boxes must never reach.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # VictoriaLogs' Service is headless; re-resolve so a restarted pod's new IP is picked up.
    resolver 10.96.0.10 valid=30s;

    server {
        listen 9428;

        # Every Oracle VPS is 10.100.0.1 on its tunnel; nothing on the pod network may use this.
        allow 10.100.0.1;
        # Looped CCTV box, only on the monero pod's tunnel (docs/oracle-wireguard-jumphost.md#looped-cctv-box)
        allow 10.100.0.20;
        deny all;

        # journal-upload appends /upload to its URL; VictoriaLogs serves exactly this path.
        location = /insert/journald/upload {
            limit_except POST {
                deny all;
            }
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            set $vlogs http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428;
            proxy_pass $vlogs;
        }

        # Looped box's vmagent remote_write; the Oracle boxes are scraped instead, so only .20 may write metrics.
        location = /api/v1/write {
            allow 10.100.0.20;
            deny all;
            limit_except POST {
                deny all;
            }
            client_max_body_size 32m;
            proxy_http_version 1.1;
            set $vmsingle http://vmsingle-vm-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428;
            proxy_pass $vmsingle;
        }

        location / {
            return 403;
        }
    }
}
