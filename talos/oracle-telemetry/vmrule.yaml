apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: oracle-telemetry
spec:
  groups:
    - name: oracle-telemetry.alerts
      rules:
        - alert: OracleNodeExporterDown
          expr: up{job="oracle-node"} == 0
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Oracle VPS {{ $labels.instance }} metrics unreachable"
            description: "node-exporter on the {{ $labels.instance }} VPS has not been scraped for 15m. Check the oracle-telemetry pod's wg0 handshake, then prometheus-node-exporter on the VPS."
        - alert: OracleNodeFilesystemFilling
          expr: node_filesystem_avail_bytes{job="oracle-node",mountpoint="/"} / node_filesystem_size_bytes{job="oracle-node",mountpoint="/"} < 0.15
          for: 30m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Oracle VPS {{ $labels.instance }} root filesystem under 15% free"
            description: "Boot volumes are sized to stay inside the free 200 GB; clean up rather than grow."
        # Caps bound snowflake/monero at ~9.21 TB per 31 days; jelly and signal are uncapped, so they are the only way over 10 TB.
        - alert: OracleTenancyEgressHigh
          expr: sum(increase(node_network_transmit_bytes_total{job="oracle-node",device="enp0s6"}[30d])) > 9e12
          for: 30m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Oracle boxes sent over 9 TB in the last 30 days
            description: "The tenancy's free outbound is 10 TB/month and it is Pay-As-You-Go, so overage bills. Look at jelly (uncapped remote Jellyfin streaming) first: sum by (instance) (increase(node_network_transmit_bytes_total{job=\"oracle-node\",device=\"enp0s6\"}[30d]))."
    - name: signal-proxy.alerts
      rules:
        # Fed by signal-proxy-upstream-check.timer via node-exporter's textfile collector on the signal VPS.
        - alert: SignalProxyUpstreamChanged
          expr: max(signal_proxy_upstream_drift{job="oracle-node",instance="signal"}) == 1
          for: 1h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Signal-TLS-Proxy relay config changed upstream
            description: "signalapp/Signal-TLS-Proxy's data/nginx-relay/nginx.conf no longer matches the copy /etc/nginx/nginx.conf on oracle-signal-proxy was ported from. Signal gives about 30 days before a change is required: re-sync the stream map, update /usr/local/share/signal-proxy/{nginx-relay.pinned.conf,PINNED_SHA}, reload nginx."
        - alert: SignalProxyUpstreamCheckStale
          expr: time() - max(signal_proxy_upstream_last_check_timestamp_seconds{job="oracle-node",instance="signal"}) > 50 * 3600 or max(signal_proxy_upstream_check_success{job="oracle-node",instance="signal"}) == 0
          for: 2h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Signal-TLS-Proxy upstream drift check is not running
            description: "signal-proxy-upstream-check on oracle-signal-proxy has not succeeded in over two days, so upstream relay changes would go unnoticed. Check the timer and its journal."
