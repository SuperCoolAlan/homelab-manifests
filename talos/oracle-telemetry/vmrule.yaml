apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: oracle-telemetry
spec:
  groups:
    - name: oracle-telemetry.alerts
      rules:
        - alert: OracleNodeExporterDown
          expr: up{job="oracle-node"} == 0
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Oracle VPS {{ $labels.instance }} metrics unreachable"
            description: "node-exporter on the {{ $labels.instance }} VPS has not been scraped for 15m. Check the oracle-telemetry pod's wg0 handshake, then prometheus-node-exporter on the VPS."
        # Needs node-exporter's systemd collector on each VPS (see docs/oracle-wireguard-jumphost.md#oracle-telemetry-all-oracle-boxes).
        - alert: OracleJournalUploadDown
          expr: max by (instance) (node_systemd_unit_state{job="oracle-node",name="systemd-journal-upload.service",state="active"}) == 0 or on (instance) (up{job="oracle-node"} == 1 unless on (instance) node_systemd_unit_state{job="oracle-node",name="systemd-journal-upload.service"})
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Oracle VPS {{ $labels.instance }} is not shipping journald to VictoriaLogs"
            description: "systemd-journal-upload on {{ $labels.instance }} is not active, or its state metric is missing. Check `journalctl -u systemd-journal-upload` there and the oracle-telemetry pod's journald-ingest nginx."
        - alert: OracleNodeFilesystemFilling
          expr: node_filesystem_avail_bytes{job="oracle-node",mountpoint="/"} / node_filesystem_size_bytes{job="oracle-node",mountpoint="/"} < 0.15
          for: 30m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Oracle VPS {{ $labels.instance }} root filesystem under 15% free"
            description: "Boot volumes are sized to stay inside the free 200 GB; clean up rather than grow."
        # snowflake's cap and monero's soft limit bound them at ~7.33 TB per 31 days; jelly and signal are uncapped, so they are the only way over 10 TB.
        - alert: OracleTenancyEgressHigh
          expr: sum(increase(node_network_transmit_bytes_total{job="oracle-node",device="enp0s6"}[30d])) > 9e12
          for: 30m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Oracle boxes sent over 9 TB in the last 30 days
            description: "The tenancy's free outbound is 10 TB/month and it is Pay-As-You-Go, so overage bills. Look at jelly (uncapped remote Jellyfin streaming) first: sum by (instance) (increase(node_network_transmit_bytes_total{job=\"oracle-node\",device=\"enp0s6\"}[30d]))."
        # Fed by monero-egress-throttle.timer via node-exporter's textfile collector on the monero VPS.
        - alert: MoneroEgressThrottled
          expr: max(monero_egress_throttle_active{job="oracle-node",instance="monero"}) == 1
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Monero VPS egress throttled to 500 kbit/s for the rest of the month
            description: "monero-jumphost passed its 630 GB soft limit this month, so peers syncing from monerod are slowed until the 1st. It is still running. If this happens in a normal month, raise THRESH in /usr/local/sbin/monero-egress-throttle and rebalance docs/oracle-wireguard-jumphost.md#egress-budget."
    - name: signal-proxy.alerts
      rules:
        # Fed by signal-proxy-upstream-check.timer via node-exporter's textfile collector on the signal VPS.
        - alert: SignalProxyUpstreamChanged
          expr: max(signal_proxy_upstream_drift{job="oracle-node",instance="signal"}) == 1
          for: 1h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Signal-TLS-Proxy relay config changed upstream
            description: "signalapp/Signal-TLS-Proxy's data/nginx-relay/nginx.conf no longer matches the copy /etc/nginx/nginx.conf on oracle-signal-proxy was ported from. Signal gives about 30 days before a change is required: re-sync the stream map, update /usr/local/share/signal-proxy/{nginx-relay.pinned.conf,PINNED_SHA}, reload nginx."
        - alert: SignalProxyUpstreamCheckStale
          expr: time() - max(signal_proxy_upstream_last_check_timestamp_seconds{job="oracle-node",instance="signal"}) > 50 * 3600 or max(signal_proxy_upstream_check_success{job="oracle-node",instance="signal"}) == 0
          for: 2h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Signal-TLS-Proxy upstream drift check is not running
            description: "signal-proxy-upstream-check on oracle-signal-proxy has not succeeded in over two days, so upstream relay changes would go unnoticed. Check the timer and its journal."
    # Looped CCTV box: vmagent there pushes through the monero pod (docs/oracle-wireguard-jumphost.md#looped-cctv-box).
    - name: looped-cctv.alerts
      rules:
        - alert: LoopedCctvNotReporting
          expr: absent_over_time(up{job="looped-node"}[15m])
          for: 5m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped CCTV box has not pushed metrics for 20m
            description: "Box down, shop internet down, or the wg-telemetry tunnel to monero-jumphost is broken. Recording does not depend on this path; check Twingate reachability first."
        - alert: LoopedCameraNoFrames
          expr: max by (camera_name) (frigate_camera_fps{job="looped-frigate"}) == 0
          for: 10m
          labels:
            severity: critical
            alertgroup: homelab
          annotations:
            summary: "Looped camera {{ $labels.camera_name }} is delivering no frames"
            description: "Frigate is up but the camera stream is dead, so nothing is being recorded. Check the camera's PoE port and the camera LAN."
        - alert: LoopedCoralFallback
          expr: max(looped_coral_fallback{job="looped-node"}) == 1
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped Frigate is running on the CPU detector
            description: "coral-guard found no Coral on the USB bus. Recording continues with slow detection. Reseat the Coral; see journalctl -t coral-guard on the box."
        # Frigate's emergency prune keeps roughly one hour of space free (~0.5% here), so a low disk is its
        # normal state only when retention no longer fits. Expiry sized to the disk leaves ~11% free.
        - alert: LoopedRecordingsDiskCritical
          expr: node_filesystem_avail_bytes{job="looped-node",mountpoint="/srv/frigate"} / node_filesystem_size_bytes{job="looped-node",mountpoint="/srv/frigate"} < 0.02
          for: 1h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped recordings partition under 2% free
            description: "Normal expiry is no longer keeping up and Frigate is deleting the oldest hour to make room, which ignores the continuous window. Lower record.motion.days in frigate/config.yml or the camera's bitrate."
        # Fed by recordings-age.timer on the box. Expect ~11 days; a wipe makes this fire until it refills.
        - alert: LoopedRetentionShort
          expr: looped_recordings_oldest_age_seconds{job="looped-node"} > 0 and looped_recordings_oldest_age_seconds{job="looped-node"} < 432000
          for: 1h
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped keeps less than 5 days of footage
            description: "The oldest recording is {{ $value | humanizeDuration }} old. Either the camera is writing far more than planned, or something deleted footage."
        - alert: LoopedJournalUploadDown
          expr: max(node_systemd_unit_state{job="looped-node",name="systemd-journal-upload.service",state="active"}) == 0
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped box is not shipping journald to VictoriaLogs
            description: "Metrics still arrive, so the tunnel works; check journalctl -u systemd-journal-upload on the box."
        # looped_audio_* are written by the box's audio-ship container through the node-exporter textfile collector
        - alert: LoopedAudioCaptureStalled
          expr: time() - max(looped_audio_newest_segment_timestamp_seconds{job="looped-node"}) > 600
          for: 5m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: Looped box has written no new audio for 10 minutes
            description: "Check docker logs audio-capture on the box; the camera's audio track or Frigate's go2rtc restream may be down."
        - alert: LoopedAudioSpoolBacklog
          expr: max(looped_audio_spool_files{job="looped-node"}) > 30
          for: 15m
          labels:
            severity: warning
            alertgroup: homelab
          annotations:
            summary: "Looped box has {{ $value }} audio segments waiting to upload"
            description: "Uploads to Garage are failing. Check docker logs audio-ship on the box, then the oracle-telemetry gate and Garage."
