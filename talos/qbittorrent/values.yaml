# qBittorrent Helm chart values

# Disable metrics for now - exporter needs qbittorrent credentials
metrics:
  enabled: false

podSecurityContext:
  fsGroup: 3001

image:
  repository: linuxserver/qbittorrent
  tag: "5.1.4"

env:
  PUID: "1000"
  PGID: "3001"
  TZ: "America/Chicago"

# Use chart's built-in gluetun, patch adds envFrom for secrets
gluetun:
  enabled: true
  image:
    tag: "v3.41.0"
  env:
    DOT: "off"
    BLOCK_MALICIOUS: "off"
    BLOCK_SURVEILLANCE: "off"
    BLOCK_ADS: "off"
    TZ: "America/Chicago"
    VPN_SERVICE_PROVIDER: "custom"
    VPN_TYPE: "wireguard"
    HEALTH_VPN_DURATION_INITIAL: "10s"
    HEALTH_VPN_DURATION_ADDITION: "5s"
    FIREWALL: "off"
    FIREWALL_OUTBOUND_SUBNETS: "10.0.0.0/8"
    FIREWALL_INPUT_PORTS: "8080,12802"
    FIREWALL_VPN_INPUT_PORTS: "12802"

# Persistence
persistence:
  enabled: true
  storageClass: nfs
  size: 5Gi
  accessMode: ReadWriteOnce
  # Torrent store lives inside the media dataset (media/torrents) so
  # radarr/sonarr can hardlink imports. Mounted at /downloads so qbt's
  # SavePath and fastresume data stay valid (no recheck after cutover).
  additionalVolumes:
    - name: media-library
      persistentVolumeClaim:
        claimName: media-library
  additionalMounts:
    - name: media-library
      mountPath: /downloads
      subPath: torrents
    - name: media-library
      mountPath: /media

# Web UI Service
webService:
  type: ClusterIP
  port: 80

# BitTorrent Service
btService:
  type: ClusterIP
  port: 12802

# Ingress
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: torrent.asandov.local
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: torrent.asandov.local
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd

# Chart 2.x bug: templates/deployment.yaml renders both .Values.rollout
# (default: strategy Recreate) and a hardcoded strategy block from
# deployment.strategy — duplicate "strategy" key breaks kustomize's strict
# YAML parser. Null out the rollout copy; minReadySeconds keeps the map
# non-empty so toYaml still emits valid YAML.
rollout:
  strategy: null
  minReadySeconds: 0

# Resources
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "2000m"
