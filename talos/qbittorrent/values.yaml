# qBittorrent Helm chart values

# Disable metrics for now - exporter needs qbittorrent credentials
metrics:
  enabled: false

podSecurityContext:
  fsGroup: 3001

image:
  repository: linuxserver/qbittorrent
  tag: "5.1.4"

env:
  PUID: "1000"
  PGID: "3001"
  TZ: "America/Chicago"

# VPN sidecar lives in patches/gluetun-secrets-dns.yaml; chart 2.x ignores a top-level gluetun: block.

# Persistence
persistence:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteOnce
  # On fast-array since 2026-09-15; qbittorrent-config-ssd is the rollback until dropped.
  existingClaim: qbittorrent-config-fast
  # Torrent store lives inside the media dataset (media/torrents) so
  # radarr/sonarr can hardlink imports. Mounted at /downloads so qbt's
  # SavePath and fastresume data stay valid (no recheck after cutover).
  additionalVolumes:
    - name: media-library
      persistentVolumeClaim:
        claimName: media-library
  additionalMounts:
    - name: media-library
      mountPath: /downloads
      subPath: torrents
    - name: media-library
      mountPath: /media

# Web UI Service
webService:
  type: ClusterIP
  port: 80

# BitTorrent Service
btService:
  type: ClusterIP
  port: 12802

# Ingress
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: torrent.asandov.local
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/hostname: torrent.asandov.local
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd

# Chart 2.x bug: templates/deployment.yaml renders both .Values.rollout
# (default: strategy Recreate) and a hardcoded strategy block from
# deployment.strategy — duplicate "strategy" key breaks kustomize's strict
# YAML parser. Null out the rollout copy; minReadySeconds keeps the map
# non-empty so toYaml still emits valid YAML.
rollout:
  strategy: null
  minReadySeconds: 0

# Resources
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "2000m"
