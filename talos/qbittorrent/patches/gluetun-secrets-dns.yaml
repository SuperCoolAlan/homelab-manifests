# Gluetun as a native sidecar; the chart's own vpn.gluetun template renders env values as invalid valueFrom.
- op: add
  path: /spec/template/spec/dnsPolicy
  value: "None"
- op: add
  path: /spec/template/spec/dnsConfig
  value:
    nameservers:
      - 10.96.0.10
- op: add
  path: /spec/template/spec/initContainers/0
  value:
    name: gluetun
    # renovate: datasource=docker depName=ghcr.io/qdm12/gluetun
    image: ghcr.io/qdm12/gluetun:v3.41.0@sha256:6b54856716d0de56e5bb00a77029b0adea57284cf5a466f23aad5979257d3045
    restartPolicy: Always
    env:
      - name: TZ
        value: America/Chicago
      - name: VPN_SERVICE_PROVIDER
        value: custom
      - name: VPN_TYPE
        value: wireguard
      # Pod DNS is kube-dns via dnsConfig, so gluetun's resolver (and its BLOCK_* lists) would go unused.
      - name: DNS_SERVER
        value: "off"
      - name: FIREWALL_OUTBOUND_SUBNETS
        value: "10.0.0.0/8"
      # Cilium gives the pod a /32, so every listener reached from pods or kubelet must be listed here.
      - name: FIREWALL_INPUT_PORTS
        value: "8080"
      # Must equal qbt's listen port and the port forwarded on the Windscribe account, or peers can't connect in.
      - name: FIREWALL_VPN_INPUT_PORTS
        value: "12802"
    envFrom:
      - secretRef:
          name: qbittorrent-wireguard-creds
    # Holds qbittorrent back until the tunnel is up, so nothing leaves via the node's Starlink IP.
    startupProbe:
      exec:
        command: ["/gluetun-entrypoint", "healthcheck"]
      initialDelaySeconds: 5
      periodSeconds: 3
      failureThreshold: 40
    securityContext:
      capabilities:
        add:
          - NET_ADMIN
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
