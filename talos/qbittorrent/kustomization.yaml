apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qbittorrent

resources:
  - namespace.yaml
  - pvcs.yaml
  - pvc-fast.yaml
  - local-asandov-ingress.yaml

generators:
  - secrets-generator.yaml

patches:
  - target:
      kind: Deployment
      name: qbittorrent
    path: patches/gluetun-secrets-dns.yaml
  # TEMPORARY: held at 0 while /config is copied from the TrueNAS NFS PV to
  # qbittorrent-config-fast. Removed in the follow-up commit that switches
  # persistence to existingClaim.
  - target:
      kind: Deployment
      name: qbittorrent
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: qbittorrent
        namespace: qbittorrent
      spec:
        replicas: 0

helmCharts:
  - name: qbittorrent
    repo: https://charts.alekc.dev
    version: 2.7.5
    releaseName: qbittorrent
    namespace: qbittorrent
    valuesFile: values.yaml
