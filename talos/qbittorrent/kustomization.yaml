apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qbittorrent

resources:
  - namespace.yaml
  - pvcs.yaml
  - pvc-fast.yaml
  - local-asandov-ingress.yaml

generators:
  - secrets-generator.yaml

patches:
  - target:
      kind: Deployment
      name: qbittorrent
    path: patches/gluetun-secrets-dns.yaml
  # PHASE4-QUIESCE — remove this entry and patches/phase4-quiesce.yaml after the
  # disk swap, in the commit that moves media-library onto local storage.
  - target:
      kind: Deployment
      name: qbittorrent
    path: patches/phase4-quiesce.yaml

helmCharts:
  - name: qbittorrent
    repo: https://charts.alekc.dev
    version: 2.7.5
    releaseName: qbittorrent
    namespace: qbittorrent
    valuesFile: values.yaml
