# fast-array: fastresume and sqlite writes want the mirror pool, not raidz2 `ssd`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-fast
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-array
  resources:
    requests:
      storage: 5Gi
