name: Build looped-transcribe

on:
  push:
    branches: [main]
    paths:
      - 'images/looped-transcribe/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  looped-transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/looped-transcribe
          # 0.2.<run> gives Renovate an orderable tag to bump the deployment with (0.1.x came from the old combined workflow)
          tags: |
            type=raw,value=latest
            type=raw,value=0.2.${{ github.run_number }}
            type=sha

      - uses: docker/build-push-action@v7.4.0
        with:
          context: images/looped-transcribe
          # ramhaus, the only GPU node, is amd64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=looped-transcribe
          # own scope so the two images don't evict each other's layers
          cache-to: type=gha,mode=max,scope=looped-transcribe
